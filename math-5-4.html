};

/* ================= 公因數圈圈圖 ================= */
function chunk(a,k){const o=[];for(let i=0;i<a.length;i+=k)o.push(a.slice(i,i+k));return o}
function vennSVG(a,b,o){
  o=o||{};const fa=factors(a),fb=factors(b),cm=fa.filter(x=>fb.indexOf(x)>=0),la=fa.filter(x=>cm.indexOf(x)<0),lb=fb.filter(x=>cm.indexOf(x)<0),g=cm[cm.length-1];
  const W=340,H=210;let s=`<svg viewBox="0 0 ${W} ${H}" class="venn">`;
  s+=`<ellipse cx="125" cy="112" rx="108" ry="86" fill="#ffc9c9" opacity=".55" stroke="#e03131" stroke-width="2"/><ellipse cx="215" cy="112" rx="108" ry="86" fill="#a5d8ff" opacity=".55" stroke="#1971c2" stroke-width="2"/>`;
  s+=`<text x="70" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#c92a2a">${a} 的因數</text><text x="270" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#1864ab">${b} 的因數</text>`;
  const put=(arr,cx,cols,show)=>{const rows=chunk(arr,cols),fs=arr.length>12?11:13;rows.forEach((r,ri)=>r.forEach((v,ci)=>{const x=cx+(ci-(r.length-1)/2)*(fs*2.3),y=112+(ri-(rows.length-1)/2)*(fs*1.7);
    if(show)s+=`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="${fs}" font-weight="900" fill="#1d2b3a">${v}</text>`;
    if(show&&o.ring&&v===g&&cx===170)s+=`<circle cx="${x}" cy="${y}" r="${fs}" fill="none" stroke="#2b8a3e" stroke-width="3"/>`}))};
  put(la,70,la.length>6?3:2,o.a!==false);put(lb,270,lb.length>6?3:2,o.b!==false);put(cm,170,cm.length>4?2:1,!!o.c);
  if(o.c)s+=`<text x="170" y="${H-4}" text-anchor="middle" font-size="13" font-weight="900" fill="#2b8a3e">公因數</text>`;
  return s+'</svg>';
}
function flist(n,cm,ring){const f=factors(n);return `<div class="fl"><b>${n} 的因數：</b>${f.map(v=>`<span class="${cm&&cm.indexOf(v)>=0?'cm':''} ${ring===v?'ring':''}">${v}</span>`).join('')}</div>`}
EXB.venn=(e,pnl,steps)=>{
  const a=e.a,b=e.b,cm=commonF(a,b),g=cm[cm.length-1];
  const ls=exAdd(pnl,flist(a)+flist(b),'wide');
  steps.push({t:`先找 <b>${a} 的因數</b>：${factors(a).join('、')}。`});
  steps.push({t:`再找 <b>${b} 的因數</b>：${factors(b).join('、')}。`});
  steps.push({t:`兩邊<b>都有</b>的數，就是公因數：<b>${cm.join('、')}</b>。`,fn:()=>{ls.innerHTML=flist(a,cm)+flist(b,cm)}});
  const v=exAdd(pnl,vennSVG(a,b,{c:false}),'wide');
  steps.push({t:`放進圈圈圖：中間重疊的地方，就是 ${a} 和 ${b} 的<b>公因數</b>。`,fn:()=>{v.innerHTML=vennSVG(a,b,{c:true})}});
  if(e.gcf!==false)steps.push({t:`公因數裡面最大的是 <b>${g}</b>，叫做 ${a} 和 ${b} 的<b>最大公因數</b>。`,fn:()=>{v.innerHTML=vennSVG(a,b,{c:true,ring:true});ls.innerHTML=flist(a,cm,g)+flist(b,cm,g)}});
  if(e.tail)(Array.isArray(e.tail)?e.tail:[e.tail]).forEach(t=>steps.push({t}));
};

/* ================= 正方形磁磚、紙條 ================= */
function tileSVG(Lc,Wc,s){
  const W=300,sc=Math.min((W-40)/Lc,150/Wc),w=Lc*sc,h=Wc*sc,x0=(W-w)/2,y0=22,H=h+50;
  let g=`<svg viewBox="0 0 ${W} ${H}" class="tile"><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#fff8e6" stroke="#8d5a2b" stroke-width="2"/>`;
  if(s){const nx=Math.floor(Lc/s),ny=Math.floor(Wc/s);const many=nx*ny>300;
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){if(many&&(i>12&&i<nx-2))continue;g+=`<rect x="${x0+i*s*sc+.5}" y="${y0+j*s*sc+.5}" width="${s*sc-1}" height="${s*sc-1}" fill="${(i+j)%2?'#ffd8a8':'#ffe8cc'}" stroke="#d9480f" stroke-width=".6"/>`}
    if(Lc%s)g+=`<rect x="${x0+nx*s*sc}" y="${y0}" width="${(Lc%s)*sc}" height="${h}" fill="url(#hz)" stroke="#e03131"/>`;
    if(Wc%s)g+=`<rect x="${x0}" y="${y0+ny*s*sc}" width="${w}" height="${(Wc%s)*sc}" fill="url(#hz)" stroke="#e03131"/>`;
    g=g.replace('<rect',`<defs><pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffe3e3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e03131" stroke-width="2"/></pattern></defs><rect`);
  }
  g+=`<text x="${W/2}" y="16" text-anchor="middle" font-size="13" font-weight="900">${Lc} 公分</text><text x="${x0+w+4}" y="${y0+h/2}" font-size="13" font-weight="900">${Wc}</text>`;
  if(s)g+=`<text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="13" font-weight="900" fill="${Lc%s||Wc%s?'#c92a2a':'#2b8a3e'}">邊長 ${s} 公分：${Lc%s||Wc%s?'剪不完，有剩下':`剛好 ${Lc/s} × ${Wc/s} ＝ ${Lc*Wc/s/s} 塊`}</text>`;
  return g+'</svg>';
}
EXB.tile=(e,pnl,steps)=>{
  const Lc=e.L,Wc=e.W,h=exAdd(pnl,tileSVG(Lc,Wc,0),'wide');
  steps.push({t:`長方形長 ${Lc} 公分、寬 ${Wc} 公分。正方形的邊長，要<b>同時</b>能把長和寬剛好分完。`});
  (e.tries||[]).forEach(s=>{const ok=Lc%s===0&&Wc%s===0;steps.push({t:`邊長 ${s} 公分：${Lc} ÷ ${s} ＝ ${Math.floor(Lc/s)}${Lc%s?` … ${Lc%s}`:''}，${Wc} ÷ ${s} ＝ ${Math.floor(Wc/s)}${Wc%s?` … ${Wc%s}`:''}，${ok?'<b>都除得盡，可以</b>':'有餘數，<b>不行</b>'}。`,fn:()=>{h.innerHTML=tileSVG(Lc,Wc,s)}})});
  if(e.venn!==false)EXB.venn({a:Lc,b:Wc,gcf:e.gcf!==false,tail:e.tail},pnl,steps);
};
function stripSVG(A,B,s){
  const W=300,sc=(W-40)/Math.max(A,B),y=[26,80];let g=`<svg viewBox="0 0 ${W} 116" class="tile">`;
  [A,B].forEach((L,k)=>{const w=L*sc;g+=`<rect x="10" y="${y[k]}" width="${w}" height="22" rx="3" fill="${k?'#a5d8ff':'#ffc9c9'}" stroke="#1d2b3a"/><text x="${10+w+4}" y="${y[k]+17}" font-size="15" font-weight="900">${L}</text>`;
    if(s){const n=Math.floor(L/s);for(let i=1;i<=n;i++)g+=`<line x1="${10+i*s*sc}" y1="${y[k]-3}" x2="${10+i*s*sc}" y2="${y[k]+25}" stroke="#d9480f" stroke-width="1.6"/>`;if(L%s)g+=`<rect x="${10+n*s*sc}" y="${y[k]}" width="${(L%s)*sc}" height="22" fill="#e03131" opacity=".45"/>`;
      g+=`<text x="12" y="${y[k]-5}" font-size="13" font-weight="900" fill="${L%s?'#c92a2a':'#2b8a3e'}">${L} ÷ ${s} ＝ ${Math.floor(L/s)}${L%s?' … '+L%s+'（剩下）':'（剛好）'}</text>`}});
  return g+'</svg>';
}
EXB.strips=(e,pnl,steps)=>{
  const A=e.a,B=e.b,h=exAdd(pnl,stripSVG(A,B,0),'wide');
  steps.push({t:`兩條紙條長 ${A} 和 ${B} 公分。紙板的長度要<b>兩條都能剛好排滿</b>。`});
  (e.tries||[]).forEach(s=>{const ok=A%s===0&&B%s===0;steps.push({t:`用 ${s} 公分排：${ok?'兩條都剛好排滿，<b>可以</b>':'有一條排不滿，<b>不行</b>'}。`,fn:()=>{h.innerHTML=stripSVG(A,B,s)}})});
  EXB.venn({a:A,b:B,gcf:e.gcf!==false},pnl,steps);
};
EXB.multi=(e,pnl,steps,q)=>{e.items.forEach(x=>exBuild(x,pnl,steps,q))};
EXB.text=(e,pnl,steps)=>{if(e.pic)exAdd(pnl,`<div class="bigic" style="font-size:calc(var(--u)*3.5)">${e.pic}</div>`,'wide');(Array.isArray(e.t)?e.t:[e.t]).forEach(t=>steps.push({t}))};
function exBuild(e,pnl,steps,q){const f=EXB[e.kind]||EXB.text;f(e,pnl,steps,q)}
</script>
<script>
/* ================= 倍數單元：工具 ================= */
function lcm(a,b){return a/gcd(a,b)*b}
function multsUpTo(n,max){const o=[];for(let v=n;v<=max;v+=n)o.push(v);return o}

/* ================= 數字機器 ================= */
function machineHTML(n,cols,shown,hl){
  return `<div class="mach"><div class="robot"><div class="rhead">🤖</div><div class="rbox">${n} ×</div></div>
   <table class="mtb"><tr><th>放進的數</th>${cols.map(c=>`<td class="${c===hl?'hl':''}">${c}</td>`).join('')}</tr>
   <tr><th>得到的數</th>${cols.map((c,i)=>`<td class="${c===hl?'hl':''} ${i<shown?'on':''}">${i<shown?n*c:''}</td>`).join('')}</tr></table></div>`;
}
EXB.machine=(e,pnl,steps)=>{
  const n=e.n,k=e.k||5,cols=e.cols||Array.from({length:Math.max(6,Math.min(10,k))},(_,i)=>i+1);
  const h=exAdd(pnl,machineHTML(n,cols,0),'wide');
  steps.push({t:`這台機器會把 <b>${n} 乘以放進的數</b>。放進 1，得到 ${n}；放進 2，得到 ${n*2}……`,fn:()=>{h.innerHTML=machineHTML(n,cols,2)}});
  steps.push({t:`得到的數 ${cols.slice(0,4).map(c=>n*c).join('、')}……都是 <b>${n} 的倍數</b>，每次多 ${n}。`,fn:()=>{h.innerHTML=machineHTML(n,cols,cols.length)}});
  if(e.k){steps.push({t:`放進 <b>${k}</b>：${n} × ${k} ＝ <b>${n*k}</b>，也就是 ${n} 的 ${k} 倍。`,fn:()=>{h.innerHTML=machineHTML(n,cols,cols.length,k)}});
    if(n>=10||k>=10)EXB.mul({a:Math.max(n,k),b:Math.min(n,k)},pnl,steps)}
};

/* ================= 直式乘法 ================= */
function mulGrid(a,b){
  const A=String(a),B=String(b),R=String(a*b),L=Math.max(R.length,A.length,B.length+1)+0;
  const box=document.createElement('div');box.className='mv';box.style.setProperty('--L',String(L));
  const tpl=`calc(var(--mw)*.8) repeat(${L},var(--mw))`;
  const row=cls=>{const r=document.createElement('div');r.className='mr '+(cls||'');r.style.gridTemplateColumns=tpl;r.innerHTML='<i class="ms"></i>'+Array.from({length:L},(_,j)=>`<i class="mc" data-c="${L-1-j}"></i>`).join('');box.appendChild(r);return r};
  const put=(r,num,shift,cls)=>{const t=String(num);for(let k=0;k<t.length;k++){const p=t.length-1-k+(shift||0);const c=r.querySelector(`.mc[data-c="${p}"]`);if(c){c.textContent=t[k];if(cls)c.classList.add(cls)}}};
  const cr=row('mk'),ra=row('ma'),rb=row('mb');put(ra,a);put(rb,b);rb.querySelector('.ms').textContent='×';rb.classList.add('line');
  return {el:box,row,put,cr,ra,rb,cell:(r,p)=>r.querySelector(`.mc[data-c="${p}"]`),clear(){box.querySelectorAll('.hl,.hot').forEach(x=>x.classList.remove('hl','hot'))}};
}
EXB.mul=(e,pnl,steps)=>{
  const a=+e.a,b=+e.b,A=String(a),B=String(b);
  if(e.lead)steps.push({t:e.lead});
  exAdd(pnl,`<span class="exlab">✏️ 直式乘法：${a} × ${b}</span>`,'wide');
  const G=mulGrid(a,b);G.el.classList.add('wide');pnl.appendChild(G.el);
  steps.push({t:`用直式乘法算 <b>${a} × ${b}</b>，個位對齊。`});
  const parts=[];
  for(let j=B.length-1;j>=0;j--){
    const bd=+B[j],shift=B.length-1-j;let carry=0;let pr=null;
    if(B.length>1)steps.push({t:`先用 ${b} 的${shift?'十位 '+bd+'（就是 '+bd*10+'）':'個位 '+bd}去乘 ${a}。`,fn:(function(sh){return ()=>{G.clear();G.cell(G.rb,sh).classList.add('hl')}})(shift)});
    const digs=[];
    for(let i=A.length-1;i>=0;i--){const ad=+A[i],p=ad*bd+carry,w=p%10,nc=Math.floor(p/10);digs.push({i,ad,p,w,cin:carry,nc});carry=nc}
    const prod=a*bd;
    const holder={};
    digs.forEach((d,k)=>{const pos=A.length-1-d.i;const last=k===digs.length-1;
      steps.push({t:`${d.ad} × ${bd}${d.cin?` ＋ 進位的 ${d.cin}`:''} ＝ <b>${d.p}</b>`+(last?`，直接寫 ${d.p}。`:(d.p>=10?`，寫 <b>${d.w}</b>，進 ${d.nc}。`:`，寫 <b>${d.w}</b>。`)),fn:()=>{G.clear();if(!holder.r){holder.r=G.row('mp');}
        G.cell(G.ra,pos).classList.add('hl');const c=G.rb.querySelector(`.mc[data-c="${shift}"]`);c&&c.classList.add('hl');
        if(last){G.put(holder.r,d.p,pos+shift,'hot')}else{G.put(holder.r,d.w,pos+shift,'hot');if(d.nc){const kc=G.cell(G.cr,pos+1);if(kc){kc.textContent=d.nc}}}
        if(shift&&k===0){for(let s=0;s<shift;s++){const z=G.cell(holder.r,s);if(z&&!z.textContent){z.textContent='0';z.classList.add('fade')}}}
      }});
    });
    steps.push({t:`${a} × ${bd*Math.pow(10,shift)} ＝ <b>${prod*Math.pow(10,shift)}</b>。`,fn:()=>{G.clear();G.cr.querySelectorAll('.mc').forEach(x=>x.textContent='');if(holder.r&&B.length>1&&j===0)holder.r.classList.add('line')}});
    parts.push(prod*Math.pow(10,shift));
  }
  if(B.length>1){steps.push({t:`把兩行加起來：${parts.join(' ＋ ')} ＝ <b>${a*b}</b>。`,fn:()=>{const r=G.row('mt');G.put(r,a*b,0,'hot')}})}
  steps.push({t:`所以 ${a} × ${b} ＝ <b>${a*b}</b>。`+(e.tail||''),fn:()=>{G.clear();G.el.classList.add('ok')}});
};

/* ================= 百數表 ================= */
function hundredHTML(a,b,max,o){o=o||{};let h=`<div class="hund">`;
  for(let v=1;v<=max;v++){const ia=a&&v%a===0,ib=b&&v%b===0;const inr=!o.range||(v>=o.range[0]&&v<=o.range[1]);
    h+=`<i class="${ia&&ib?'both':ia?'ha':ib?'hb':''} ${inr?'':'out'}">${v}</i>`}
  return h+'</div>';
}
EXB.hundred=(e,pnl,steps)=>{
  const a=e.n,b=e.n2||0,max=e.max||(b?Math.min(100,Math.max(60,lcm(a,b)*2)):Math.min(100,Math.max(50,a*10)));
  const h=exAdd(pnl,hundredHTML(0,0,max,e),'wide');
  steps.push({t:`在 1 到 ${max} 的數表上，從 ${a} 開始，每次多 ${a}，塗上顏色：${multsUpTo(a,max).slice(0,6).join('、')}……這些都是 <b>${a} 的倍數</b>。`,fn:()=>{h.innerHTML=hundredHTML(a,0,max,e)}});
  if(b){steps.push({t:`再把 <b>${b} 的倍數</b>塗上另一種顏色：${multsUpTo(b,max).slice(0,6).join('、')}……`,fn:()=>{h.innerHTML=hundredHTML(a,b,max,e)}});
    const cm=multsUpTo(lcm(a,b),max);steps.push({t:`兩種顏色<b>都塗到</b>的（⭐）：${cm.join('、')}，就是 ${a} 和 ${b} 的<b>公倍數</b>。`})}
  if(e.range){const inr=multsUpTo(b?lcm(a,b):a,max).filter(v=>v>=e.range[0]&&v<=e.range[1]);steps.push({t:`在 ${e.range[0]}～${e.range[1]} 之間的有：<b>${inr.join('、')||'沒有'}</b>。`})}
};

/* ================= 個位數字規則 ================= */
const ONES={2:[0,2,4,6,8],5:[0,5],10:[0]};
EXB.ones=(e,pnl,steps)=>{
  const k=e.k,ok=ONES[k];
  exAdd(pnl,`<div class="rule"><b>${k} 的倍數</b>：個位數字是 ${ok.map(d=>`<span>${d}</span>`).join('')}</div>`,'wide');
  steps.push({t:`判斷是不是 <b>${k} 的倍數</b>，只要看<b>個位數字</b>：個位是 ${ok.join('、')}${ok.length>1?' 其中一個':''}，就是 ${k} 的倍數。`});
  if(k===2)steps.push({t:'因為 2 的倍數是 2、4、6、8、10、12……個位一直是 0、2、4、6、8 輪流出現。'});
  if(k===5)steps.push({t:'5 的倍數是 5、10、15、20、25……個位不是 5 就是 0。'});
  if(k===10)steps.push({t:'10 的倍數是 10、20、30……個位一定是 0。'});
  if(e.list){const box=exAdd(pnl,`<div class="olist">${e.list.map(s=>{s=String(s);return `<div class="on1"><span>${esc(s.slice(0,-1))}</span><b>${esc(s.slice(-1))}</b><em></em></div>`}).join('')}</div>`,'wide');
    const its=$$('.on1',box);
    const per=Math.max(1,Math.ceil(e.list.length/4));
    for(let i=0;i<e.list.length;i+=per){const grp=e.list.slice(i,i+per).map(String);steps.push({t:grp.map(s=>{const d=s.slice(-1);const y=/\d/.test(d)&&ok.indexOf(+d)>=0;return `${s}：個位是 ${d}，${y?'<b>是</b>':'不是'}`}).join('；')+'。',fn:(function(i){return ()=>{for(let j=i;j<i+per&&j<its.length;j++){const s=String(e.list[j]),d=s.slice(-1),y=/\d/.test(d)&&ok.indexOf(+d)>=0;its[j].classList.add(y?'y':'n');its[j].querySelector('em').textContent=y?'✅':'❌'}}})(i)})}
  }
  if(e.tail)steps.push({t:e.tail});
};

/* ================= 公倍數：兩排倍數＋跳跳數線 ================= */
function jumpsSVG(a,b,max){
  const W=320,m=16,y=58,sc=(W-2*m)/max,L=lcm(a,b);let s=`<svg viewBox="0 0 ${W} 112" class="jumps">`;
  s+=`<line x1="${m}" y1="${y}" x2="${W-m}" y2="${y}" stroke="#1d2b3a" stroke-width="2"/>`;
  for(let v=a;v<=max;v+=a){const x1=m+(v-a)*sc,x2=m+v*sc;s+=`<path d="M${x1} ${y-2} Q${(x1+x2)/2} ${y-26} ${x2} ${y-2}" fill="none" stroke="#e8590c" stroke-width="2"/>`}
  for(let v=b;v<=max;v+=b){const x1=m+(v-b)*sc,x2=m+v*sc;s+=`<path d="M${x1} ${y+2} Q${(x1+x2)/2} ${y+26} ${x2} ${y+2}" fill="none" stroke="#1971c2" stroke-width="2"/>`}
  s+=`<text x="${m}" y="${y+5}" font-size="10" text-anchor="end">0</text>`;
  for(let v=L;v<=max;v+=L){const x=m+v*sc;s+=`<circle cx="${x}" cy="${y}" r="6" fill="#ffd43b" stroke="#e67700" stroke-width="2"/><text x="${x}" y="${y+40}" text-anchor="middle" font-size="13" font-weight="900" fill="#e67700">${v}</text>`}
  s+=`<text x="${m}" y="14" font-size="12" font-weight="900" fill="#e8590c">上面每次跳 ${a}</text><text x="${m}" y="108" font-size="12" font-weight="900" fill="#1971c2">下面每次跳 ${b}</text>`;
  return s+'</svg>';
}
function mrow(n,arr,cm,ring){return `<div class="fl"><b>${n} 的倍數：</b>${arr.map(v=>`<span class="${cm.indexOf(v)>=0?'cm':''} ${v===ring?'ring':''}">${v}</span>`).join('')}<span>……</span></div>`}
EXB.lcm=(e,pnl,steps)=>{
  const a=e.a,b=e.b,L=lcm(a,b),big=Math.max(a,b),max=Math.min(L*2,big*12);
  const ma=multsUpTo(a,max).slice(0,12),mb=multsUpTo(b,max).slice(0,12),cm=ma.filter(v=>mb.indexOf(v)>=0);
  const ls=exAdd(pnl,mrow(a,ma,[])+mrow(b,mb,[]),'wide');
  steps.push({t:`先寫出 <b>${a} 的倍數</b>：${ma.slice(0,6).join('、')}……`});
  steps.push({t:`再寫出 <b>${b} 的倍數</b>：${mb.slice(0,6).join('、')}……`});
  steps.push({t:`兩排<b>都有</b>的數：${cm.join('、')}……，就是 ${a} 和 ${b} 的<b>公倍數</b>。`,fn:()=>{ls.innerHTML=mrow(a,ma,cm)+mrow(b,mb,cm)}});
  const j=exAdd(pnl,jumpsSVG(a,b,max),'wide');
  steps.push({t:`看數線：一隻每次跳 ${a}，一隻每次跳 ${b}，<b>一起踩到</b>的地方就是公倍數。`});
  if(e.small!==false)steps.push({t:`公倍數裡<b>最小</b>的是 <b>${L}</b>，叫做 ${a} 和 ${b} 的<b>最小公倍數</b>。`,fn:()=>{ls.innerHTML=mrow(a,ma,cm,L)+mrow(b,mb,cm,L)}});
  if(e.more)steps.push({t:`其他的公倍數，都是 ${L} 的倍數：${L}、${L*2}、${L*3}……有無限多個，<b>沒有最大的</b>。`});
  if(e.tail)(Array.isArray(e.tail)?e.tail:[e.tail]).forEach(t=>steps.push({t}));
};

/* ================= 長方形拼成正方形 ================= */
function rect2sqSVG(Lc,Wc,S){
  const W=280,sc=Math.min(180/S,(W-70)/S),side=S*sc,x0=(W-side)/2,y0=24;let g=`<svg viewBox="0 0 ${W} ${side+50}" class="tile">`;
  const nx=S/Lc,ny=S/Wc;
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++)g+=`<rect x="${x0+i*Lc*sc}" y="${y0+j*Wc*sc}" width="${Lc*sc}" height="${Wc*sc}" fill="${(i+j)%2?'#d0ebff':'#a5d8ff'}" stroke="#1864ab" stroke-width="1.2" style="animation:popin .4s ${(i+j)*.05}s both"/>`;
  g+=`<text x="${W/2}" y="16" text-anchor="middle" font-size="13" font-weight="900">${S} 公分（${nx} 個 ${Lc}）</text><text x="${x0+side+4}" y="${y0+side/2}" font-size="12" font-weight="900">${S}</text><text x="${W/2}" y="${y0+side+18}" text-anchor="middle" font-size="12" font-weight="800">直的：${ny} 個 ${Wc} ＝ ${S} 公分</text>`;
  return g+'</svg>';
}
EXB.rect2sq=(e,pnl,steps)=>{
  const Lc=e.L,Wc=e.W,S=lcm(Lc,Wc);
  steps.push({t:`長方形長 ${Lc}、寬 ${Wc}。要拼成正方形，邊長要<b>同時</b>是 ${Lc} 的倍數，也是 ${Wc} 的倍數。`});
  EXB.lcm({a:Lc,b:Wc},pnl,steps);
  const h=exAdd(pnl,rect2sqSVG(Lc,Wc,S),'wide');
  steps.push({t:`邊長 ${S} 公分：橫的放 ${S/Lc} 個，直的放 ${S/Wc} 個，剛好拼成最小的正方形。`});
};

/* ================= 公因數還是公倍數 ================= */
EXB.which=(e,pnl,steps)=>{
  const c=exAdd(pnl,`<div class="which"><div class="wc ${e.ans==='cf'?'on':''}"><div class="wi">✂️📦</div><b>公因數</b><small>把東西<b>分開、剪開、裝袋</b>，全部分完<br>答案比原來的數<b>小</b></small></div><div class="wc ${e.ans==='cm'?'on':''}"><div class="wi">🧱🚌</div><b>公倍數</b><small>一直<b>排、拼、數、一起出發</b><br>答案比原來的數<b>大</b></small></div></div>`,'wide');
  steps.push({t:'判斷要用公因數還是公倍數，先想一想：東西是要<b>分掉</b>，還是要<b>一直加上去</b>？'});
  steps.push({t:e.why||(e.ans==='cf'?'這一題是把東西<b>分成一樣多</b>、全部分完，答案會比原來的數小，所以要找<b>公因數</b>。':'這一題是一直<b>排、拼、數</b>，答案會比原來的數大，所以要找<b>公倍數</b>。')});
};

/* ================= 因數與倍數的關係 ================= */
EXB.fm=(e,pnl,steps)=>{
  const a=e.a,b=e.b,c=a*b;
  const box=exAdd(pnl,`<div class="term"><div class="teq"><b class="td">${a}</b> × <b class="tb">${b}</b> ＝ <b class="ta">${c}</b></div>
   <div class="tsay"><b class="td">${a}</b> 和 <b class="tb">${b}</b> 是 <b class="ta">${c}</b> 的<b>因數</b>（小的）</div>
   <div class="tsay"><b class="ta">${c}</b> 是 <b class="td">${a}</b> 和 <b class="tb">${b}</b> 的<b>倍數</b>（大的）</div></div>`,'wide');
  const ss=$$('.tsay',box);ss.forEach(x=>x.style.opacity=.15);
  steps.push({t:`看算式 ${a} × ${b} ＝ ${c}。`});
  steps.push({t:`乘起來的兩個數 <b>${a} 和 ${b}，是 ${c} 的因數</b>。`,fn:()=>ss[0].style.opacity=1});
  steps.push({t:`乘出來的答案 <b>${c}，是 ${a} 的倍數，也是 ${b} 的倍數</b>。`,fn:()=>ss[1].style.opacity=1});
  if(e.tail)steps.push({t:e.tail});
};

/* ================= 範圍裡最接近的倍數 ================= */
EXB.near=(e,pnl,steps)=>{
  const n=e.n,lim=e.lim,q=Math.floor(lim/n),r=lim%n,below=n*q,above=n*(q+1);
  steps.push({t:`先用 ${lim} 除以 ${n}，看看 ${lim} 裡面有幾個 ${n}。`});
  EXB.div({a:lim,d:n,noFactor:true},pnl,steps);
  const ans=e.dir==='above'?(r?above:lim+n):(r?below:lim-n);
  if(e.dir==='above')steps.push({t:`${n} × ${q} ＝ ${below}${r?' 比 '+lim+' 小':''}，再多一個：${n} × ${q+(r?1:1)} ＝ <b>${r?above:lim+n}</b>，是比 ${lim} 大、最接近的 ${n} 的倍數。`});
  else steps.push({t:`${n} × ${r?q:q-1} ＝ <b>${ans}</b>，是比 ${lim} 小、最接近的 ${n} 的倍數。`});
  EXB.mul({a:Math.max(n,ans/n),b:Math.min(n,ans/n)},pnl,steps);
  if(e.tail)(Array.isArray(e.tail)?e.tail:[e.tail]).forEach(t=>steps.push({t}));
};
</script>
<script>
/* ================= 分數：記號 [分子/分母]、帶分數 2[3/4] ================= */
const FRE=/(\d+)?\[([^\[\]\/]+)\/([^\[\]]+)\]/g;
function FR(n,d,w){return (w?w:'')+'['+n+'/'+d+']'}
function frHTML(w,n,d){return `<span class="mix">${w?`<span class="w">${w}</span>`:''}<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span></span>`}
function frx(h){return String(h).replace(FRE,(m,w,n,d)=>frHTML(w||'',n,d))}
function fparse(s){const m=String(s).match(/(\d+)?\[(\d+)\/(\d+)\]/);if(m)return {w:+(m[1]||0),n:+m[2],d:+m[3]};const k=String(s).match(/\d+/);return k?{w:+k[0],n:0,d:1}:null}
function fstr(f){return f.n===0?String(f.w):FR(f.n,f.d,f.w||'')}
function fimp(f){return {w:0,n:f.w*f.d+f.n,d:f.d}}
function fmix(f){const t=f.w*f.d+f.n;return {w:Math.floor(t/f.d),n:t%f.d,d:f.d}}
function fsimp(f){const g=gcd(f.n,f.d)||1;return {w:f.w,n:f.n/g,d:f.d/g}}
function fnum(f){return f.w*f.d+f.n}
function fcmp(a,b){return Math.sign(fnum(a)*b.d-fnum(b)*a.d)}
function feq(a,b){return fcmp(a,b)===0}
function fval(f){return fnum(f)/f.d}
function lcmA(a){return a.reduce((x,y)=>lcm(x,y))}
// 國語讀法：四分之三、二又四分之一
function spkPart(x){return String(x).trim().replace(/\d+/g,m=>zhInt(+m)).replace(/×/g,'乘以').replace(/÷/g,'除以').replace(/[＋+]/g,'加').replace(/[－−]/g,'減').replace(/□|\(\s*\)|（\s*）|\(　\)/g,'空格')}
function spkFrac(w,n,d){const pre=w?zhInt(+w)+'又':'';if(/[×÷＋+－−]/.test(n+d))return pre+'分子是'+spkPart(n)+'、分母是'+spkPart(d)+'的分數';return pre+spkPart(d)+'分之'+spkPart(n)}
function spkFracs(s){return String(s).replace(FRE,(m,w,n,d)=>spkFrac(w,n,d))}

/* ================= 圖：大餅、紙條 ================= */
const PCOLS=['#ff922b','#4dabf7','#69db7c','#da77f2','#ffd43b','#ff8787','#38d9a9','#a9e34b','#f783ac','#748ffc','#ffa94d','#63e6be'];
function pieSVG(d,shade,o){
  o=o||{};const R=46,c=50;
  const isOn=i=>o.cols?!!o.cols[i]:(typeof shade==='number'?i<shade:(shade||[]).indexOf(i)>=0);
  const P=a=>(c+R*Math.cos(a)).toFixed(2)+' '+(c+R*Math.sin(a)).toFixed(2);
  const A=i=>-Math.PI/2+i*2*Math.PI/d;
  let s=`<svg viewBox="0 0 100 100" class="pie" style="width:${o.w||'5.6em'}"><circle cx="${c}" cy="${c}" r="${R+2.6}" fill="#e9c08a"/><circle cx="${c}" cy="${c}" r="${R}" fill="#fffaf0"/>`;
  for(let i=0;i<d;i++){if(!isOn(i))continue;const f=o.cols?o.cols[i]:(o.fill||'#f6b04b');const op=o.dim&&o.dim(i)?.25:1;
    if(d===1)s+=`<circle cx="${c}" cy="${c}" r="${R}" fill="${f}" opacity="${op}"/>`;
    else s+=`<path d="M${c} ${c}L${P(A(i))}A${R} ${R} 0 0 1 ${P(A(i+1))}Z" fill="${f}" opacity="${op}"/>`}
  if(o.k>1)for(let i=0;i<d*o.k;i++){if(i%o.k===0)continue;const a=-Math.PI/2+i*2*Math.PI/(d*o.k);s+=`<line x1="${c}" y1="${c}" x2="${(c+R*Math.cos(a)).toFixed(2)}" y2="${(c+R*Math.sin(a)).toFixed(2)}" stroke="#d9480f" stroke-width="1.4" stroke-dasharray="3 2.2"/>`}
  if(d>1)for(let i=0;i<d;i++){const a=A(i),g=o.group>1,thick=g&&i%o.group===0;s+=`<line x1="${c}" y1="${c}" x2="${(c+R*Math.cos(a)).toFixed(2)}" y2="${(c+R*Math.sin(a)).toFixed(2)}" stroke="${thick?'#5c2d0c':'#a0602a'}" stroke-width="${thick?3.2:g?1:1.6}" ${g&&!thick?'stroke-dasharray="3 2"':''}/>`}
  if(d===1&&!o.cols&&isOn(0))s+=`<circle cx="${c}" cy="${c}" r="15" fill="none" stroke="#e03131" stroke-width="2.4"/><text x="${c}" y="${c+6}" text-anchor="middle" font-size="17" font-weight="900" fill="#e03131">囍</text>`;
  return s+`<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="#8a4b17" stroke-width="2.4"/></svg>`;
}
function pieW(cnt){return cnt<=1?'6.4em':cnt<=2?'5.2em':cnt<=4?'4.2em':'3.3em'}
function piesHTML(total,d,o){o=Object.assign({},o||{});const cnt=Math.max(1,Math.ceil(total/d));if(!o.w)o.w=pieW(cnt);let h='<div class="pies">';for(let i=0;i<cnt;i++)h+=pieSVG(d,Math.max(0,Math.min(d,total-i*d)),o);return h+'</div>'}
function barSVG(d,shade,o){
  o=o||{};const W=300,H=30,x0=4,y0=4,w=W-8,cw=w/d;
  const isOn=i=>o.cols?!!o.cols[i]:(typeof shade==='number'?i<shade:(shade||[]).indexOf(i)>=0);
  let s=`<svg viewBox="0 0 ${W} ${H+8}" class="fbar">`;
  for(let i=0;i<d;i++){const on=isOn(i),f=on?(o.cols?o.cols[i]:(o.fill||'#f6b04b')):'#fffaf0',op=o.dim&&o.dim(i)?.25:1;s+=`<rect x="${(x0+i*cw).toFixed(2)}" y="${y0}" width="${(cw+.3).toFixed(2)}" height="${H}" fill="${f}" opacity="${op}"/>`}
  if(o.k>1)for(let i=1;i<d*o.k;i++){if(i%o.k===0)continue;const x=(x0+i*cw/o.k).toFixed(2);s+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0+H}" stroke="#d9480f" stroke-width="1.3" stroke-dasharray="3 2"/>`}
  for(let i=1;i<d;i++){const g=o.group>1,thick=g&&i%o.group===0,x=(x0+i*cw).toFixed(2);s+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0+H}" stroke="${thick?'#5c2d0c':'#a0602a'}" stroke-width="${thick?3:g?.9:1.4}" ${g&&!thick?'stroke-dasharray="3 2"':''}/>`}
  return s+`<rect x="${x0}" y="${y0}" width="${w}" height="${H}" fill="none" stroke="#8a4b17" stroke-width="2.2" rx="2"/></svg>`;
}
function barsHTML(total,d,o){const cnt=Math.max(1,Math.ceil(total/d));let h='<div class="bars">';for(let i=0;i<cnt;i++)h+=barSVG(d,Math.max(0,Math.min(d,total-i*d)),o);return h+'</div>'}
function fpic(kind,d,n,o){return kind==='pie'?piesHTML(n,d,o):barsHTML(n,d,o)}
function line01SVG(d,n){const W=300,m=20,y=34,sc=(W-2*m)/d;let s=`<svg viewBox="0 0 ${W} 64" class="nline"><line x1="${m}" y1="${y}" x2="${W-m}" y2="${y}" stroke="#1d2b3a" stroke-width="2.4"/>`;
  if(n)s+=`<line x1="${m}" y1="${y}" x2="${m+n*sc}" y2="${y}" stroke="#e8590c" stroke-width="7" stroke-linecap="round"/>`;
  for(let i=0;i<=d;i++){const x=m+i*sc;s+=`<line x1="${x}" y1="${y-9}" x2="${x}" y2="${y+9}" stroke="#1d2b3a" stroke-width="${i===0||i===d?2.6:1.4}"/>`}
  return s+`<text x="${m}" y="${y+27}" text-anchor="middle" font-size="15" font-weight="900">0</text><text x="${W-m}" y="${y+27}" text-anchor="middle" font-size="15" font-weight="900">1</text></svg>`}
// 分子位置的數線（分母都一樣）
function nlineSVG(D,lo,hi,ins){const W=320,m=14,y=42,sc=(W-2*m)/D;let s=`<svg viewBox="0 0 ${W} 74" class="nline">`;
  s+=`<rect x="${m+lo*sc}" y="${y-9}" width="${(hi-lo)*sc}" height="18" fill="#fff3bf"/><line x1="${m}" y1="${y}" x2="${W-m}" y2="${y}" stroke="#1d2b3a" stroke-width="2"/>`;
  const every=D<=24?1:D<=48?5:10;
  for(let i=0;i<=D;i++){const x=m+i*sc,ok=ins.indexOf(i)>=0;s+=`<line x1="${x}" y1="${y-5}" x2="${x}" y2="${y+5}" stroke="#1d2b3a" stroke-width="${i===0||i===D?2:.9}"/>`;
    if(ok)s+=`<circle cx="${x}" cy="${y}" r="${D>40?2.6:4.5}" fill="#2f9e44"/>`;
    if(i%every===0||i===lo||i===hi||(ok&&ins.length<=8))s+=`<text x="${x}" y="${y+20}" text-anchor="middle" font-size="${D>24?8:10}" font-weight="800" fill="${ok?'#2b8a3e':'#566573'}">${i}</text>`}
  [[lo,'#e03131'],[hi,'#1971c2']].forEach(([v,c])=>{const x=m+v*sc;s+=`<polygon points="${x},${y-10} ${x-6},${y-22} ${x+6},${y-22}" fill="${c}"/>`});
  return s+`<text x="${m}" y="12" font-size="11" font-weight="900" fill="#566573">數線上的數字是分子（分母都是 ${D}）</text></svg>`}

/* ================= 擴分、約分的箭頭圖 ================= */
function arrowHead(x,y,dx,dy,c){const L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=-uy,py=ux,s=9;return `<polygon points="${x},${y} ${(x-ux*s+px*s*.55).toFixed(1)},${(y-uy*s+py*s*.55).toFixed(1)} ${(x-ux*s-px*s*.55).toFixed(1)},${(y-uy*s-py*s*.55).toFixed(1)}" fill="${c}"/>`}
function scaleSVG(o){
  const st=o.stage||0,tw=t=>String(t).length*19+12;
  const lw=Math.max(tw(o.n),tw(o.d),42),rw=Math.max(tw(o.N),tw(o.D),42),ww=o.w?String(o.w).length*21+6:0;
  const lx=10+ww+lw/2,rx=lx+lw/2+64+ww+rw/2,W=rx+rw/2+10,mid=(lx+rx)/2;
  const T=(x,y,t,c,sz,anc)=>`<text x="${x}" y="${y}" text-anchor="${anc||'middle'}" font-size="${sz||32}" font-weight="900" fill="${c||'#1d2b3a'}">${t}</text>`;
  const frac=(x,hw,n,d,cn,cd)=>(o.w?T(x-hw/2-4,113,o.w,'#5c3c00',36,'end'):'')+T(x,81,n,cn)+`<line x1="${x-hw/2}" y1="93" x2="${x+hw/2}" y2="93" stroke="#1d2b3a" stroke-width="3.2" stroke-linecap="round"/>`+T(x,127,d,cd);
  let s=`<svg viewBox="0 0 ${W} 180" class="scl" style="max-width:${Math.round(W*1.3)}px">`+frac(lx,lw,o.n,o.d)+T(mid,105,'＝','#1d2b3a',30);
  const kn=o.known,nT=st>=2||kn==='n'?o.N:'□',dT=st>=3||kn==='d'?o.D:'□';
  const cN=nT==='□'?'#ff922b':st>=2&&kn!=='n'?'#c2410c':'#1d2b3a',cD=dT==='□'?'#ff922b':st>=3&&kn!=='d'?'#c2410c':'#1d2b3a';
  s+=frac(rx,rw,nT,dT,cN,cD);
  if(st>=1){const x1=lx+lw/2-2,x2=rx-rw/2+2,c='#e8590c',lab=(o.op==='÷'?'÷':'×')+' '+o.k,bw=lab.length*13+18;
    s+=`<path d="M${x1} 57 Q${mid} 5 ${x2} 57" fill="none" stroke="${c}" stroke-width="2.6"/>`+arrowHead(x2,57,x2-mid,52,c);
    s+=`<path d="M${x1} 139 Q${mid} 191 ${x2} 139" fill="none" stroke="${c}" stroke-width="2.6"/>`+arrowHead(x2,139,x2-mid,-52,c);
    s+=`<rect x="${mid-bw/2}" y="13" width="${bw}" height="27" rx="13" fill="#fff4e6" stroke="${c}" stroke-width="1.6"/>`+T(mid,33,lab,c,21);
    s+=`<rect x="${mid-bw/2}" y="149" width="${bw}" height="27" rx="13" fill="#fff4e6" stroke="${c}" stroke-width="1.6"/>`+T(mid,169,lab,c,21)}
  return s+'</svg>';
}

/* ================= 解說：分數 ================= */
EXB.frac=(e,pnl,steps)=>{const n=e.n,d=e.d;
  if(e.pic==='line')exAdd(pnl,line01SVG(d,n),'wide');else exAdd(pnl,`<div class="pq">${fpic(e.pic||'bar',d,n,{})}<div class="pql">${frx(FR(n,d))}</div></div>`,'wide');
  (Array.isArray(e.t)?e.t:[e.t||`平分成 ${d} 份，取 ${n} 份，就是 [${n}/${d}]。`]).forEach(t=>steps.push({t}))};

// 平分：a ÷ b ＝ [a/b]
EXB.shareF=(e,pnl,steps)=>{
  const a=e.a,b=e.b,th=e.thing==null?'大餅':e.thing,u=e.u||'個',who=e.who||'人',verb=e.verb||'平分給';
  const kind=e.pic==='bar'?'bar':'pie',can=e.pic!==false&&a<=8&&b<=12;
  if(can){
    const h=exAdd(pnl,'','wide'),pw=pieW(a);
    const draw=m=>{let x=`<div class="${kind==='pie'?'pies':'bars'}">`;
      for(let i=0;i<a;i++){const cols=m>=2?Array.from({length:b},(_,j)=>PCOLS[j%PCOLS.length]):null,dim=m===3?(j=>j!==0):null;
        x+=kind==='pie'?pieSVG(m?b:1,m?b:1,{cols,dim,w:pw}):barSVG(m?b:1,m?b:1,{cols,dim})}
      x+='</div>';
      if(m>=2)x+=`<div class="ppl">${Array.from({length:b},(_,j)=>`<span style="background:${PCOLS[j%PCOLS.length]};opacity:${m===3&&j?.3:1}">${j+1}</span>`).join('')}</div>`;
      h.innerHTML=x};
    draw(0);
    steps.push({t:`把 ${a} ${u}${th}${verb} ${b} ${who}。`});
    steps.push({t:`每 1 ${u}都平分成 <b>${b}</b> 份，每一份是 [1/${b}] ${u}。`,fn:()=>draw(1)});
    steps.push({t:`一份一份分出去，同一個顏色的是同一${who}的。`,fn:()=>draw(2)});
    steps.push({t:`第 1 ${who}（顏色 1）拿到 ${a} 份 [1/${b}]，就是 <b>[${a}/${b}] ${u}</b>。`,fn:()=>draw(3)});
  }else steps.push({t:`把 ${a} ${u}${th}${verb} ${b} ${who}，就是 ${a} ÷ ${b}。`});
  exAdd(pnl,`<div class="dcard"><b class="ta">${a}</b> ÷ <b class="td">${b}</b> ＝ ${frHTML('',`<b class="ta">${a}</b>`,`<b class="td">${b}</b>`)}</div>`,'wide');
  steps.push({t:`寫成算式：${a} ÷ ${b} ＝ [${a}/${b}]。<b>被除數 ${a} 當分子，除數 ${b} 當分母</b>。`});
  if(a>b&&e.mix!==false)EXB.toMix({a,b,u},pnl,steps);
};
// 假分數化成帶分數（直式除法）
EXB.toMix=(e,pnl,steps)=>{const a=e.a,b=e.b,q=Math.floor(a/b),r=a%b,u=e.u||'';
  steps.push({t:e.lead||`[${a}/${b}] 的分子比分母大，是<b>假分數</b>，用 ${a} ÷ ${b} 化成帶分數。`});
  if(e.pic!==false&&a<=24&&b<=8)exAdd(pnl,`<div class="pq">${piesHTML(a,b,{})}<div class="pql">${frx(FR(a,b))} ＝ ${frx(r?FR(r,b,q):String(q))}</div></div>`,'wide');
  EXB.div({a,d:b,noFactor:true},pnl,steps);
  if(!r){steps.push({t:`除盡了，${a} ÷ ${b} ＝ <b>${q}</b>。`});return}
  exAdd(pnl,`<div class="dcard">${a} ÷ ${b} ＝ <b class="tq">${q}</b> … <b class="tr">${r}</b>　➜　${frHTML(`<b class="tq">${q}</b>`,`<b class="tr">${r}</b>`,b)}</div>`,'wide');
  steps.push({t:`商 <b>${q}</b> 是整數部分（${q} 個完整的），餘數 <b>${r}</b> 是分子，除數 ${b} 還是分母。`});
  steps.push({t:`所以 ${a} ÷ ${b} ＝ [${a}/${b}] ＝ <b>${q}[${r}/${b}]</b>${u?' '+u:''}。`});
};
// 每 b 裝一袋（包含除）
EXB.pack=(e,pnl,steps)=>{const a=e.a,b=e.b,q=Math.floor(a/b),r=a%b,u=e.u||'袋',uu=e.uu||'公斤';
  if(a<=40){const cols=Array.from({length:a},(_,i)=>{const g=Math.floor(i/b);return g>=q?'#ff922b':g%2?'#ffd8a8':'#f6b04b'});exAdd(pnl,`<div class="pq">${barSVG(a,a,{cols,group:b})}<div class="cnt">每 ${b} ${uu}一${u}，最後一段是剩下的</div></div>`,'wide')}
  steps.push({t:`${a} ${uu}，每 ${b} ${uu}一${u}：看 ${a} 裡面有幾個 ${b}，就是 ${a} ÷ ${b}。`});
  steps.push({t:`裝滿 ${q} ${u}，還剩下 ${r} ${uu}。剩下的不夠一${u}，是 [${r}/${b}] ${u}。`});
  steps.push({t:`合起來是 ${q}[${r}/${b}] ${u}，也可以寫成 [${a}/${b}] ${u}。`});
  EXB.toMix({a,b,u,pic:false,lead:`用直式算 ${a} ÷ ${b}，再化成帶分數。`},pnl,steps);
};
// 種樹（間隔）
EXB.interval=(e,pnl,steps)=>{const both=e.ends==='both',gaps=both?e.cnt-1:e.cnt+1,u0=e.u0||'棵';
  exAdd(pnl,`<div class="intv">${both?'🌳<i></i>🌳<i></i>🌳<i></i>🌳':'<em>起點</em><i></i>🌳<i></i>🌳<i></i>🌳<i></i><em>終點</em>'}<div class="intl">${both?'4 '+u0+'，3 個間隔':'3 '+u0+'，4 個間隔'}</div></div>`,'wide');
  steps.push({t:both?`頭尾都有：看小例子，4 ${u0}之間有 3 個間隔，<b>間隔數 ＝ 數量 － 1</b>。`:`頭尾都沒有：看小例子，3 ${u0}會隔出 4 個間隔，<b>間隔數 ＝ 數量 ＋ 1</b>。`});
  steps.push({t:`所以 ${e.cnt} ${u0}，間隔有 ${e.cnt} ${both?'－':'＋'} 1 ＝ <b>${gaps}</b> 個。`});
  steps.push({t:`每個間隔：${e.len} ÷ ${gaps} ＝ [${e.len}/${gaps}] 公尺。`});
  EXB.toMix({a:e.len,b:gaps,u:'公尺',pic:false,lead:`把 [${e.len}/${gaps}] 化成帶分數。`},pnl,steps);
};

// 擴分 ×k、約分 ÷k
EXB.scale=(e,pnl,steps)=>{
  const w=e.w||0,n=e.n,d=e.d,k=e.k,op=e.op||'×',mul=op==='×';
  const N=mul?n*k:n/k,D=mul?d*k:d/k,verb=mul?'乘以':'除以',nm=mul?'擴分':'約分';
  if(e.lead)steps.push({t:e.lead});
  if(e.ask==='n'||e.ask==='d'){const byD=e.ask==='n',from=byD?d:n,to=byD?D:N,nmF=byD?'分母':'分子';
    steps.push({t:`先看${nmF}：${from} 變成 ${to}，${mul?`${to} ÷ ${from}`:`${from} ÷ ${to}`} ＝ ${k}，所以是<b>${verb} ${k}</b>。`});
    if(e.vc!==false&&(mul?to:from)>=20)EXB.div({a:mul?to:from,d:mul?from:to,noFactor:true,lead:'用直式除法算算看。'},pnl,steps)}
  const cells=mul?D:d,pk=e.pic===undefined?(cells<=36&&!w?'bar':false):e.pic;
  if(pk&&cells<=48){
    const ph=exAdd(pnl,'','wide');
    const one=o=>fpic(pk,d,n,o);
    ph.innerHTML=`<div class="pq">${one({})}<div class="pql">${frx(FR(n,d))}</div></div>`;
    steps.push({t:`[${n}/${d}]：把 1 個平分成 ${d} 份，有 ${n} 份。`});
    const B=()=>{ph.innerHTML=`<div class="pq">${one(mul?{k}:{group:k})}<div class="pql">${frx(FR(N,D))}</div></div>`};
    if(mul)steps.push({t:`每一份再平分成 <b>${k}</b> 小份：全部變成 ${d} × ${k} ＝ ${D} 份，有顏色的變成 ${n} × ${k} ＝ ${N} 份。`,fn:B});
    else steps.push({t:`每 <b>${k}</b> 份合成一大份：全部變成 ${d} ÷ ${k} ＝ ${D} 份，有顏色的變成 ${n} ÷ ${k} ＝ ${N} 份。`,fn:B});
  }
  const sh=exAdd(pnl,'','wide'),known=e.ask==='n'?'d':e.ask==='d'?'n':null;
  const drawS=st=>{sh.innerHTML=scaleSVG({w,n,d,N,D,op,k,stage:st,known})};drawS(0);
  const vcalc=()=>{if(e.vc===false)return;const pr=(e.vpart||e.ask)==='n'?[n,'分子']:[d,'分母'],x=pr[0];
    if(mul&&Math.max(x,k)>=10)EXB.mul({a:Math.max(x,k),b:Math.min(x,k),lead:`${pr[1]}用直式乘法算：${x} × ${k}。`},pnl,steps);
    else if(!mul&&x>=20)EXB.div({a:x,d:k,noFactor:true,lead:`${pr[1]}用直式除法算：${x} ÷ ${k}。`},pnl,steps)};
  if(e.quick){steps.push({t:`分子、分母都${verb} ${k}：${n} ${op} ${k} ＝ ${N}，${d} ${op} ${k} ＝ ${D}。${FR(n,d,w)} ＝ <b>${FR(N,D,w)}</b>。`,fn:()=>drawS(3)});vcalc();return}
  steps.push({t:`分子和分母要<b>同時${verb}同一個數 ${k}</b>${w?`（整數部分 ${w} 不變）`:''}。`,fn:()=>drawS(1)});
  steps.push({t:`分子：${n} ${op} ${k} ＝ <b>${N}</b>。`,fn:()=>drawS(2)});
  steps.push({t:`分母：${d} ${op} ${k} ＝ <b>${D}</b>。`,fn:()=>drawS(3)});
  vcalc();
  steps.push({t:`所以 ${FR(n,d,w)} ＝ <b>${FR(N,D,w)}</b>${e.noRule?'。':`，分數的大小不變，這就是<b>${nm}</b>。`}`});
};
// 約分到不能再約分
EXB.simp=(e,pnl,steps)=>{
  const w=e.w||0,n=e.n,d=e.d,g=gcd(n,d),cm=commonF(n,d);
  if(e.lead)steps.push({t:e.lead});
  steps.push({t:`${w?`整數部分 ${w} 不變，只看分數 [${n}/${d}]。`:''}要約分，先找分子 <b>${n}</b> 和分母 <b>${d}</b> 的公因數。`});
  const ls=exAdd(pnl,flist(n)+flist(d),'wide');
  steps.push({t:`${n} 的因數：${factors(n).join('、')}；${d} 的因數：${factors(d).join('、')}。`});
  if(g===1){steps.push({t:`兩邊都有的只有 <b>1</b>，沒有比 1 大的公因數，[${n}/${d}] <b>不能再約分</b>了。`,fn:()=>{ls.innerHTML=flist(n,[1])+flist(d,[1])}});return}
  steps.push({t:`公因數有 ${cm.join('、')}，最大的是 <b>${g}</b>。分子、分母同除以 ${g}，一次就約到底。`,fn:()=>{ls.innerHTML=flist(n,cm,g)+flist(d,cm,g)}});
  EXB.scale({n,d,w,k:g,op:'÷',pic:e.pic===undefined?(d<=24&&!w?'bar':false):e.pic,noRule:true},pnl,steps);
  steps.push({t:`[${n/g}/${d/g}] 的分子和分母，除了 1 沒有別的公因數，<b>不能再約分</b>了。`});
};
// 一個一個檢查是不是一樣大
EXB.eqlist=(e,pnl,steps)=>{
  const T=fparse(e.t),mixT=T.w>0,canon=f=>fsimp(mixT?fmix(f):f),Ts=canon(T),g=gcd(T.n,T.d);
  if(g>1){steps.push({t:`先把 ${e.t} 約分到不能再約分。`});EXB.scale({n:T.n,d:T.d,w:T.w,k:g,op:'÷',pic:false,quick:true,noRule:true},pnl,steps)}
  else steps.push({t:`${e.t} 已經不能再約分了。`});
  const rows=e.list.map(s=>{const f=fparse(s),c=canon(f),ok=feq(f,T);const imp=mixT&&!f.w&&f.n>=f.d;return {s,f,c,ok,imp,red:gcd(f.n,f.d)>1}});
  const tb=exAdd(pnl,`<table class="trytb">${rows.map(r=>`<tr class="hid"><td>${frx(r.s)}</td><td>${r.imp||r.red?'＝ '+frx(fstr(r.c)):'不能約分'}</td><td>${r.ok?'✅':'❌'}</td></tr>`).join('')}</table>`,'wide');
  const trs=$$('tr',tb),per=Math.max(1,Math.ceil(rows.length/4));
  steps.push({t:`再把每一個分數也約分，看看是不是等於 <b>${fstr(Ts)}</b>。`});
  for(let i=0;i<rows.length;i+=per){const grp=rows.slice(i,i+per);
    steps.push({t:grp.map(r=>(r.imp?`${r.s} ＝ ${fstr(fmix(r.f))}${r.red?` ＝ ${fstr(r.c)}`:''}`:r.red?`${r.s} ＝ ${fstr(r.c)}`:`${r.s} 不能約分`)+`，${r.ok?'<b>一樣大</b>':'不一樣'}`).join('；')+'。',fn:(function(i){return ()=>{for(let j=i;j<i+per&&j<trs.length;j++)trs[j].classList.remove('hid')}})(i)})}
  const ok=rows.filter(r=>r.ok).map(r=>r.s),no=rows.filter(r=>!r.ok).map(r=>r.s);
  if(e.odd)steps.push({t:`所以不一樣大的是：<b>${no.join('、')}</b>。`});
  else steps.push({t:`所以和 ${e.t} 一樣大的是：<b>${ok.join('、')||'沒有'}</b>。`});
};
// 還能不能約分（一個一個看）
EXB.redlist=(e,pnl,steps)=>{
  const rows=e.list.map(s=>{const f=fparse(s);return {s,f,g:gcd(f.n,f.d)}});
  steps.push({t:'看分子和分母，除了 1 以外還有沒有<b>公因數</b>？有，就可以再約分。'});
  const tb=exAdd(pnl,`<table class="trytb">${rows.map(r=>`<tr class="hid"><td>${frx(r.s)}</td><td>${r.g>1?`都能被 ${r.g} 整除`:'只有公因數 1'}</td><td>${r.g>1?'可以約分':'不能約分'}</td></tr>`).join('')}</table>`,'wide');
  const trs=$$('tr',tb),per=Math.max(1,Math.ceil(rows.length/4));
  for(let i=0;i<rows.length;i+=per){const grp=rows.slice(i,i+per);steps.push({t:grp.map(r=>(r.f.w?`${r.s} 只看分數部分 [${r.f.n}/${r.f.d}]：`:`${r.s}：`)+(r.g>1?`${r.f.n} 和 ${r.f.d} 都能被 ${r.g} 整除，<b>可以再約分</b>`:`${r.f.n} 和 ${r.f.d} 只有公因數 1，<b>不能再約分</b>`)).join('；')+'。',fn:(function(i){return ()=>{for(let j=i;j<i+per&&j<trs.length;j++)trs[j].classList.remove('hid')}})(i)})}
  steps.push({t:`所以不能再約分的是：<b>${rows.filter(r=>r.g===1).map(r=>r.s).join('、')||'沒有'}</b>。`});
};
// 找幾個分母的最小公倍數
function lcmSteps(ds,pnl,steps){
  ds=uniq(ds).sort((a,b)=>a-b);const L=lcmA(ds),big=ds[ds.length-1],oth=ds.slice(0,-1);
  if(!oth.length)return big;
  if(oth.every(x=>big%x===0)){steps.push({t:`${big} 是 ${oth.join('、')} 的倍數，所以 ${ds.join('、')} 的最小公倍數就是 <b>${big}</b>。`});return big}
  const ms=multsUpTo(big,L);
  const box=exAdd(pnl,`<div class="fl"><b>${big} 的倍數：</b>${ms.map(v=>`<span data-v="${v}">${v}</span>`).join('')}</div>`,'wide');
  const mark=(vs,cls)=>()=>vs.forEach(v=>{const sp=box.querySelector(`[data-v="${v}"]`);sp&&sp.classList.add(cls)});
  steps.push({t:`找分母 ${ds.join('、')} 的<b>最小公倍數</b>：寫出最大的 ${big} 的倍數，一個一個看能不能被 ${oth.join('、')} 整除。`});
  const bad=ms.slice(0,-1);
  if(bad.length<=3)bad.forEach(v=>steps.push({t:`${v}：${oth.map(x=>`${v} ÷ ${x} ${v%x?'除不盡':'除得盡'}`).join('，')}，不行。`,fn:mark([v],'x')}));
  else steps.push({t:`${bad.join('、')}：都不能同時被 ${oth.join('、')} 整除，不行。`,fn:mark(bad,'x')});
  steps.push({t:`${L}：${oth.map(x=>`${L} ÷ ${x} ＝ ${L/x}`).join('，')}，<b>都除得盡</b>！最小公倍數是 <b>${L}</b>。`,fn:()=>{mark([L],'cm')();mark([L],'ring')()}});
  return L;
}
EXB.lcmf=(e,pnl,steps)=>{const L=lcmSteps(e.ds,pnl,steps);steps.push({t:e.tail||`所以分母可以先通分成 <b>${L}</b>。`})};
// 通分
EXB.tong=(e,pnl,steps)=>{
  const A=fparse(e.a),B=fparse(e.b);
  steps.push({t:`<b>通分</b>：把 ${e.a} 和 ${e.b} 的分母，變成一樣的分母。${A.w||B.w?'帶分數的整數部分不用變。':''}`});
  let D=e.D;
  if(D)steps.push({t:`題目說分母要變成 <b>${D}</b>。`});else D=lcmSteps([A.d,B.d],pnl,steps);
  const out=[A,B].map(F=>{const k=D/F.d;
    if(k===1)steps.push({t:`${fstr(F)} 的分母已經是 ${D}，不用變。`});
    else EXB.scale({w:F.w,n:F.n,d:F.d,k,op:'×',pic:false,quick:true,noRule:true,vpart:'n',vc:F.n>=10,lead:`${fstr(F)}：${D} ÷ ${F.d} ＝ ${k}，分子、分母都乘以 ${k}。`},pnl,steps);
    return {w:F.w,n:F.n*k,d:D}});
  if(D<=24&&!A.w&&!B.w&&A.n<=A.d&&B.n<=B.d)exAdd(pnl,cmpBars([['',out[0]],['',out[1]]]),'wide');
  steps.push({t:`通分後：${e.a} ＝ <b>${fstr(out[0])}</b>，${e.b} ＝ <b>${fstr(out[1])}</b>。`+(e.tail||'')});
};
function cmpBars(items){return `<div class="brows">${items.map(([l,f])=>`<div class="brow"><div class="bl">${l?`<small>${esc(l)}</small>`:''}${frx(fstr(f))}</div>${barSVG(f.d,f.n,{})}</div>`).join('')}</div>`}
// 兩個分數比大小
EXB.cmpf=(e,pnl,steps)=>{
  let A=fparse(e.a),B=fparse(e.b);e._dv=0;
  if(e.tip)(Array.isArray(e.tip)?e.tip:[e.tip]).forEach(t=>steps.push({t}));
  const toM=F=>{if(F.w===0&&F.n>=F.d){const M=fmix(F);steps.push({t:`${fstr(F)} 是假分數，先化成帶分數：${F.n} ÷ ${F.d} ＝ ${M.w}${M.n?` … ${M.n}`:''}，所以 ${fstr(F)} ＝ <b>${fstr(M)}</b>。`});if(F.n>=20&&e.vc!==false&&!e._dv){e._dv=1;EXB.div({a:F.n,d:F.d,noFactor:true},pnl,steps)}return M}return F};
  if(A.w||B.w||A.n>=A.d||B.n>=B.d){A=toM(A);B=toM(B)}
  let r;
  if(A.w!==B.w){r=Math.sign(A.w-B.w);steps.push({t:`整數部分 ${A.w} 和 ${B.w} 不一樣，<b>整數部分大的就比較大</b>，不用再比分數部分。`})}
  else{
    if(A.w)steps.push({t:`整數部分都是 ${A.w}，只要比分數的部分：[${A.n}/${A.d}] 和 [${B.n}/${B.d}]。`});
    let a={w:0,n:A.n,d:A.d},b={w:0,n:B.n,d:B.d};const sa=fsimp(a),sb=fsimp(b);
    if(a.n&&b.n&&a.d!==b.d&&a.n!==b.n&&(sa.d!==a.d||sb.d!==b.d)&&lcm(sa.d,sb.d)<lcm(a.d,b.d)){
      steps.push({t:'可以約分的先約分，數字變小，比較好算。'});
      if(sa.d!==a.d)EXB.scale({n:a.n,d:a.d,k:a.d/sa.d,op:'÷',pic:false,quick:true,noRule:true,vc:false},pnl,steps);
      if(sb.d!==b.d)EXB.scale({n:b.n,d:b.d,k:b.d/sb.d,op:'÷',pic:false,quick:true,noRule:true,vc:false},pnl,steps);
      a=sa;b=sb}
    if(a.d===b.d){if(a.d<=30)exAdd(pnl,cmpBars([[e.la,a],[e.lb,b]]),'wide');
      steps.push({t:`分母一樣都是 ${a.d}，每一份一樣大。分子大的份數多，就比較大：${a.n} ${a.n>b.n?'＞':a.n<b.n?'＜':'＝'} ${b.n}。`});r=Math.sign(a.n-b.n)}
    else if(a.n===b.n){if(Math.max(a.d,b.d)<=30)exAdd(pnl,cmpBars([[e.la,a],[e.lb,b]]),'wide');
      steps.push({t:`分子一樣，都是 ${a.n} 份。分母越大，切得越多，<b>每一份就越小</b>：[1/${a.d}] ${a.d<b.d?'＞':'＜'} [1/${b.d}]。`});r=Math.sign(b.d-a.d)}
    else{const D=lcmSteps([a.d,b.d],pnl,steps),ka=D/a.d,kb=D/b.d,a2={w:0,n:a.n*ka,d:D},b2={w:0,n:b.n*kb,d:D};
      steps.push({t:`用 ${D} 當共同的分母，把兩個分數通分。`});
      [[a,ka],[b,kb]].forEach(([F,k])=>{if(k>1)EXB.scale({n:F.n,d:F.d,k,op:'×',pic:false,quick:true,noRule:true,vpart:'n',vc:F.n>=10},pnl,steps)});
      if(D<=30)exAdd(pnl,cmpBars([[e.la,a2],[e.lb,b2]]),'wide');
      steps.push({t:`通分後分母一樣，比分子：${fstr(a2)} ${a2.n>b2.n?'＞':a2.n<b2.n?'＜':'＝'} ${fstr(b2)}。`});r=Math.sign(a2.n-b2.n)}
  }
  const sym=r>0?'＞':r<0?'＜':'＝';
  steps.push({t:`所以 ${e.la?e.la+' '+e.a:e.a} ${sym} ${e.lb?e.lb+' '+e.b:e.b}。`+(e.end?' '+e.end:'')});
};
// 三個以上比大小
EXB.cmp3=(e,pnl,steps)=>{
  const F=e.items.map(x=>({lab:x[0],s:x[1],f:fparse(x[1])})),nm=x=>x.lab===x.s?'':x.lab+'：';
  if(e.lead)steps.push({t:e.lead});
  steps.push({t:`要比 ${F.length} 個分數，先把它們化成<b>同分母</b>再比分子。`});
  F.forEach(x=>{if(x.f.w){const I=fimp(x.f);steps.push({t:`${nm(x)}${x.s} 先化成假分數：${x.f.w} ＝ [${x.f.w*x.f.d}/${x.f.d}]，${x.f.w*x.f.d} ＋ ${x.f.n} ＝ ${I.n}，所以是 <b>${fstr(I)}</b>。`});x.f=I}});
  const ds=uniq(F.map(x=>x.f.d)),L=ds.length>1?lcmSteps(ds,pnl,steps):ds[0];
  F.forEach(x=>{const k=L/x.f.d;x.g={w:0,n:x.f.n*k,d:L};if(k>1)steps.push({t:`${nm(x)}${fstr(x.f)} 分子、分母都乘以 ${k}，＝ <b>${fstr(x.g)}</b>。`})});
  const srt=F.slice().sort((p,q)=>p.g.n-q.g.n);
  if(L<=30&&F.every(x=>x.g.n<=L))exAdd(pnl,cmpBars(F.map(x=>[x.lab===x.s?'':x.lab,x.g])),'wide');
  exAdd(pnl,`<div class="rank">${srt.map(x=>`<div>${x.lab===x.s?'':`<b>${esc(x.lab)}</b>`}${frx(fstr(x.g))}</div>`).join('<span>＜</span>')}</div>`,'wide');
  steps.push({t:`分母都是 ${L}，比分子：${srt.map(x=>fstr(x.g)).join(' ＜ ')}。`});
  if(e.q==='max'||e.q==='min'){const p=e.q==='min'?srt[0]:srt[srt.length-1];steps.push({t:`所以${e.qw||(e.q==='min'?'最小':'最大')}的是 <b>${p.lab}</b>${p.lab===p.s?'':'（'+p.s+'）'}。`+(e.end||'')})}
  else if(e.end)steps.push({t:e.end});
};
// 介於兩個分數之間
EXB.between=(e,pnl,steps)=>{
  const lo=fparse(e.lo),hi=fparse(e.hi);
  if(e.N){const N=e.N,kl=N/lo.n,kh=N/hi.n,L={n:N,d:lo.d*kl},H={n:N,d:hi.d*kh};
    steps.push({t:`題目要分子是 ${N}，先把 ${e.lo} 和 ${e.hi} 都擴分成分子 ${N}。`});
    EXB.scale({n:lo.n,d:lo.d,k:kl,op:'×',pic:false,quick:true,noRule:true},pnl,steps);
    EXB.scale({n:hi.n,d:hi.d,k:kh,op:'×',pic:false,quick:true,noRule:true},pnl,steps);
    const big=Math.max(L.d,H.d),small=Math.min(L.d,H.d),ds=[];for(let x=small+1;x<big;x++)ds.push(x);
    steps.push({t:`分子一樣，<b>分母越大，分數越小</b>。分母要比 ${small} 大、比 ${big} 小：${ds.map(x=>FR(N,x)).join('、')}，共 <b>${ds.length} 個</b>。`});return}
  const D=e.D,ok=F=>D%F.d===0||(F.d%D===0&&F.n%(F.d/D)===0);
  if(ok(lo)&&ok(hi)){
    steps.push({t:`題目要分母是 ${D} 的分數，先把 ${e.lo} 和 ${e.hi} 都化成分母 ${D}。`});
    const conv=F=>{if(D%F.d===0){const k=D/F.d;if(k>1)EXB.scale({n:F.n,d:F.d,k,op:'×',pic:false,quick:true,noRule:true,vc:false},pnl,steps);else steps.push({t:`${fstr(F)} 的分母已經是 ${D}。`});return F.n*k}
      const k=F.d/D;EXB.scale({n:F.n,d:F.d,k,op:'÷',pic:false,quick:true,noRule:true,vc:false},pnl,steps);return F.n/k};
    const a=conv(lo),b=conv(hi),ins=[];for(let i=a+1;i<b;i++)ins.push(i);
    if(D<=64)exAdd(pnl,nlineSVG(D,a,b,ins),'wide');
    steps.push({t:`在 [${a}/${D}] 和 [${b}/${D}] 中間，分子可以是 ${ins.join('、')}（兩頭不算）。`});
    steps.push({t:`所以是 ${ins.map(i=>FR(i,D)).join('、')}，共 <b>${ins.length} 個</b>。`});
  }else{
    const L=lcmA([lo.d,hi.d,D]);
    steps.push({t:`分母 ${lo.d}、${hi.d}、${D} 不一樣，把它們通通化成同一個分母來比。`});
    lcmSteps([lo.d,hi.d,D],pnl,steps);
    const a=lo.n*L/lo.d,b=hi.n*L/hi.d,m=L/D,cand=[];for(let k=1;k<=D*3;k++){const v=k*m;if(v>a&&v<b)cand.push(k)}
    steps.push({t:`${e.lo} ＝ [${a}/${L}]，${e.hi} ＝ [${b}/${L}]。`});
    if(D<=8){const all=[];for(let k=1;k<D;k++)all.push(`[${k}/${D}] ＝ [${k*m}/${L}]`);steps.push({t:`分母是 ${D} 的分數：${all.join('、')}。`})}
    steps.push({t:`比 [${a}/${L}] 大、比 [${b}/${L}] 小的是 ${cand.map(k=>FR(k,D)).join('、')}，共 <b>${cand.length} 個</b>。`});
  }
};
// 三種魔法卡
EXB.defs=(e,pnl,steps)=>{const on=e.on;
  exAdd(pnl,`<div class="which three"><div class="wc ${on==='擴分'?'on':''}"><div class="wi">✖️</div><b>擴分</b><small>分子、分母<b>同乘以</b>比 1 大的整數</small></div><div class="wc ${on==='約分'?'on':''}"><div class="wi">➗</div><b>約分</b><small>分子、分母<b>同除以</b>比 1 大的公因數</small></div><div class="wc ${on==='通分'?'on':''}"><div class="wi">🟰</div><b>通分</b><small>不同分母化成<b>同分母</b></small></div></div>`,'wide');
  (Array.isArray(e.t)?e.t:[e.t]).forEach(t=>steps.push({t}));
  if(e.ex)exBuild(e.ex,pnl,steps);
};

function stemPart(s){return esc(s).replace(/(\d+(?:\.\d+)?|[□☆])/g,'<span class="num">$1</span>').replace(/\n/g,'<br>')}
function stemHtml(s){s=String(s);let out='',last=0;const re=new RegExp(FRE.source,'g');let m;while((m=re.exec(s))){out+=stemPart(s.slice(last,m.index))+'<span class="num">'+frHTML(m[1]?esc(m[1]):'',esc(m[2]),esc(m[3]))+'</span>';last=re.lastIndex}return out+stemPart(s.slice(last))}
function vlen(s){return String(s).replace(new RegExp(FRE.source,'g'),'xx').length}
function routeSVG(nodes,segs){ // nodes:[{e,t}], segs:['0.297km',...]

  let d='';nodes.forEach((x,i)=>{const p=pt(i);d+=(i?'L':'M')+p.x+' '+p.y});
  s+=`<path d="${d}" fill="none" stroke="#b07a45" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 0"/><path d="${d}" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  segs.forEach((t,i)=>{if(!t)return;const a=pt(i),b=pt(i+1);s+=`<rect x="${(a.x+b.x)/2-24}" y="${(a.y+b.y)/2-9}" width="48" height="16" rx="8" fill="#fff" stroke="#ff8c42"/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2+3.5}" text-anchor="middle" font-size="10" font-weight="900" fill="#c2410c">${esc(t)}</text>`});
  nodes.forEach((x,i)=>{const p=pt(i);s+=`<text x="${p.x}" y="${p.y+6}" text-anchor="middle" font-size="18">${x.e}</text><text x="${p.x}" y="${i%2?p.y+26:p.y-14}" text-anchor="middle" font-size="10.5" font-weight="900" fill="#1d3b5c">${esc(x.t)}</text>`});
  return s+'</svg>';
}

R.tf=(q,host,ctx)=>{
  const sh=shell(q,host,ctx);

R.multi=(q,host,ctx)=>{
  const sh=shell(q,host,ctx);

  const box=document.createElement('div');box.className='mpick'+(dg?'':n<=4?' n'+Math.min(n,4):n===6?' n3':n<=5?'':'');if(!dg&&n===5)box.className='mpick n3';sh.ctl.appendChild(box);

R.order=(q,host,ctx)=>{

  ctx.reveal=()=>{want.forEach((i,j)=>{slots[j].innerHTML=frx(esc(q.items[i]));slots[j].classList.add('f');bs[i].classList.add('ok')})};

// 直式填答
/* ================= 題目流程 ================= */
const QM={qs:[],i:0,res:[],cfg:null,gen:0,ctx:null};
function qmStart(qs,cfg){QM.qs=qs;QM.i=0;QM.res=[];QM.cfg=cfg;QM.gen++;qmShow()}
function qmProg(){const el=QM.cfg.prog;if(!el)return;el.innerHTML=QM.qs.map((q,i)=>`<i class="${i<QM.i?(QM.res[i]?'ok':'bad'):i===QM.i?'cur':''}"></i>`).join('')}
function mkCtx(q,gen){

    right(sh,sayTxt){if(ctx.done)return;ctx.done=true;cheer();QM.cfg.onAnswer&&QM.cfg.onAnswer(ctx.first,q,true);
      if(sh){if(!sayTxt)setFb(sh,ctx.first?'✅ 答對了！':'✅ 對了！','ok');else setFb(sh,'✅ '+frx(esc(sayTxt)),'ok')}
      const t=sayTxt?TTS.est(sayTxt)+500:1300;if(sayTxt)say(sayTxt);

    finish(first,counted){if(gen!==QM.gen||ctx._fin)return;ctx._fin=true;if(!counted&&!first&&!ctx._counted){}QM.res[QM.i]=first;QM.i++;qmShow()},

  };

}
function qmShow(){
  const gen=QM.gen;

  const q=QM.qs[QM.i];qmProg();

// 畫面放不下時提示

<script>
/* ================= 題庫工具 ================= */
function MC(stem,correct,wrongs,o){o=o||{};correct=String(correct);let w=uniq(wrongs.map(String)).filter(x=>x!==correct);w=shuffle(w).slice(0,(o.n||4)-1);if(!w.length)throw new Error('no wrongs: '+stem);
  let all=o.keep?o.keep.map(String):shuffle([correct].concat(w));
  const q=Object.assign({type:'mc',stem,opts:all.map(t=>({t})),ans:all.indexOf(correct),instr:'選出正確的答案'},o);delete q.n;delete q.keep;if(q.ans<0)throw new Error('ans '+stem);return q}
function MCK(stem,opts,ans,o){return Object.assign({type:'mc',stem,opts:opts.map(t=>({t:String(t)})),ans,instr:'選出正確的答案'},o||{})}
function TF(stem,ans,ex,o){return Object.assign({type:'tf',stem,ans,ex,instr:'判斷對不對'},o||{})}
function YN(stem,ans,labs,ex,o){return Object.assign({type:'tf',stem,ans,ex,tfL:labs,instr:'想一想，選一個'},o||{})}
function MULTI(stem,items,ansVals,o){items=items.map(String);const av=ansVals.map(String);return Object.assign({type:'multi',stem,items,ans:items.map((t,i)=>av.indexOf(t)>=0?i:-1).filter(i=>i>=0),instr:'可以選很多個，選好按確定'},o||{})}

function fvs(s){const f=fparse(s);return f?fval(f):null}
function MCF(stem,correct,wrongs,o){const cv=fvs(correct);wrongs=wrongs.filter(w=>{if(/\/(0|1)\]|\[0\//.test(w))return false;const v=fvs(w);return !(cv!=null&&v!=null&&Math.abs(v-cv)<1e-9)});return MC(stem,correct,wrongs,o)}
function CMP(a,b,o){const r=fcmp(fparse(a),fparse(b));return Object.assign({type:'cmp',stem:'比比看，哪一邊比較大？',a,b,ans:r>0?'>':r<0?'<':'=',say:`${a} 和 ${b}，哪一邊比較大？`,hint:'先看分母或分子一不一樣；都不一樣，就先通分再比。',instr:'比比看',ex:{kind:'cmpf',a,b}},o||{})}
function ORDER(stem,items,dir,o){return Object.assign({type:'order',stem,items,vals:items.map(fvs),dir,instr:'依照順序點一點',ex:{kind:'cmp3',items:items.map(s=>[s,s]),q:'order'}},o||{})}

  {id:10,ic:'🛍️',name:'生活比一比',sub:'誰多？誰少？',story:'客人來買大餅，幫大家比一比誰多誰少。',mk:[[1,pairWordQ],[1,()=>paperPair(rnd(0,5))],[2,()=>paperPair(rnd(6,12))],[2,()=>pick(L10D)()],[3,threeQ],[3,()=>pick(L10B)()]],prize:'🛍️'},
  {id:11,ic:'🎁',name:'喜餅大訂單',sub:'綜合題，完成婚禮訂單',story:'新郎新娘訂了好多喜餅，答對題目才能做完！',boss:true,prize:'🏆'}
];
function qKey(q){return q.type+'|'+q.stem+'|'+(q.a||'')+(q.b||'')+(q.items||[]).join(',')+(q.opts||[]).map(o=>o.t).join(',')}
function tryMake(fn,seen){for(let t=0;t<16;t++){try{const q=fn();if(!q)continue;const k=qKey(q);if(seen&&seen.has(k))continue;seen&&seen.add(k);return q}catch(e){(window.__qerr=window.__qerr||[]).push(String(e&&e.stack||e))}}return null}
const SEEN=new Set();
function buildQs(lv,n){
  const tiers=[1,2,3].map(t=>lv.mk.filter(x=>x[0]===t).map(x=>x[1]));
  const a=Math.max(1,Math.round(n/3)),b=Math.max(1,Math.round(n/3)),cnt=[a,b,Math.max(1,n-a-b)];const out=[];
  cnt.forEach((c,ti)=>{for(let i=0;i<c;i++){const pool=tiers[ti].length?tiers[ti]:tiers[1];const q=tryMake(pick(pool),SEEN)||tryMake(pick(pool),null);if(q){q.tier=ti+1;q.lv=lv.id;out.push(q)}}});
  return out;
}
function buildBoss(n){
  const out=[];const ls=shuffle(LV.filter(l=>!l.boss)).slice(0,n-3);
  ls.forEach(l=>{const pool=l.mk.filter(x=>x[0]>=2).map(x=>x[1]);const q=tryMake(pick(pool),SEEN);if(q){q.lv=l.id;out.push(q)}});
  shuffle(BOSSF).slice(0,3).forEach(f=>{const q=tryMake(f,null);if(q)out.push(q)});
  return shuffle(out);
}

   ${seg('teams',[[2,'2 隊'],[3,'3 隊'],[4,'4 隊']],'隊伍')}${seg('per',[[3,'3 題'],[4,'4 題'],[5,'5 題']],'每隊')}${seg('lvl',[[1,'簡單'],[2,'普通'],[3,'挑戰']],'難度')}
   <button class="btn g big" id="gGo">開始比賽</button><button class="btn" id="gNo">回地圖</button>`;
  $$('.seg',b).forEach(sg=>$$('.btn',sg).forEach(x=>x.onclick=()=>{SFX.tap();G2[sg.getAttribute('data-k')]=+x.getAttribute('data-v');$$('.btn',sg).forEach(y=>y.classList.remove('sel'));x.classList.add('sel')}));
  $('#gGo').onclick=()=>{closeOv();startGroup()};$('#gNo').onclick=()=>closeOv();
  showOv('ovGroup');say('選好隊伍數量和題目數量，按開始比賽。');
}
function startGroup(){
  stopAll();const tok=RUNTOK;const T=G2.teams,n=T*G2.per;
  const qs=[];const pools=LV.filter(l=>!l.boss);
  for(let i=0;i<n;i++){const l=pools[i%pools.length===0?rnd(0,pools.length-1):rnd(0,pools.length-1)];const pool=l.mk.filter(x=>x[0]===G2.lvl).map(x=>x[1]);const q=tryMake(pick(pool.length?pool:l.mk.map(x=>x[1])),SEEN);if(q)qs.push(q)}
  RUN={kind:'group',sc:Array(T).fill(0),cur:0,combo:0,got:0};
  levelScreen();$('#teams').classList.remove('hide');
  const strip=()=>{const max=G2.per*2;$('#teams').style.gridTemplateColumns=T>2?'1fr 1fr':'1fr';$('#teams').innerHTML=RUN.sc.map((s,i)=>`<div class="team ${i===RUN.cur?'cur':''}" style="background:${TEAMC[i]}">${TEAMI[i]} ${TEAMN[i]}<div class="trk"><span style="left:${4+Math.min(1,s/max)*88}%">${TEAMI[i]}</span></div><b>${s}</b></div>`).join('')};
  strip();
  introCard('👥','小組競賽開始！',`${TEAMN.slice(0,T).join('、')}輪流答題`,()=>{
    qmStart(qs,{host:$('#qwrap'),prog:$('#prog'),
      onQ:(q,i)=>{RUN.cur=i%T;strip();later(()=>toast(`${TEAMI[RUN.cur]} ${TEAMN[RUN.cur]}，換你們！`),100)},
      onAnswer:(first,q,got)=>{if(got){RUN.sc[RUN.cur]+=first?2:1;strip()}},
      onEnd:()=>{if(tok!==RUNTOK)return;const mx=Math.max.apply(null,RUN.sc);const win=RUN.sc.map((s,i)=>s===mx?TEAMN[i]:null).filter(Boolean);fireworks();
        showResult({emoji:'🏆',title:win.length>1?`${win.join('、')} 平手！`:`${win[0]} 第一名！`,sub:RUN.sc.map((s,i)=>`${TEAMI[i]} ${TEAMN[i]}：${s} 步`).join('<br>'),say:win.length>1?`${win.join('、')}平手！大家都很努力！`:`${win[0]}第一名！大家都很努力！`,
          btns:[{t:'再比一次',cls:'g big',fn:()=>startGroup()},{t:'回地圖',cls:'',fn:()=>{stopAll();go('home')}}]})}});
  },'小組競賽開始！各隊輪流答題，答對的隊伍往前走。第一次就答對走兩步，第二次答對走一步。');
}

/* ================= 設定、暫停 ================= */
function openSet(){
  const b=$('#setBody');const seg=(k,vals,lab)=>`<div class="row">${lab}<div class="seg" data-k="${k}" style="flex:1;max-width:66%">${vals.map(v=>`<button class="btn ${S[k]===v[0]?'sel':''}" data-v="${v[0]}">${v[1]}</button>`).join('')}</div></div>`;
  b.innerHTML=`<h2>⚙️ 老師設定</h2>${seg('voice',[[true,'要語音'],[false,'不要語音']],'語音說明')}${seg('rate',[[0.7,'慢'],[0.85,'中'],[1,'快']],'說話速度')}${seg('count',[[5,'5 題'],[6,'6 題'],[8,'8 題']],'每站題數')}${seg('sfx',[[true,'開'],[false,'關']],'音效')}
   <div class="sub" style="line-height:1.5">・每一站都可以直接點選，不用從第一站開始。<br>・每次打開遊戲，星星都會重新計算。<br>・喜餅點數會跟著名字保存在這台裝置。</div><button class="btn g big" id="setOk">好了</button>`;
  $$('.seg',b).forEach(sg=>$$('.btn',sg).forEach(x=>x.onclick=()=>{const k=sg.getAttribute('data-k');let v=x.getAttribute('data-v');v=v==='true'?true:v==='false'?false:+v;S[k]=v;if(k==='voice'){syncVoice();sset('m54-voice',v);if(!v)TTS.stop()}if(k==='rate'){sset('m54-rate',v);say('這樣的速度可以嗎？')}if(k==='count')sset('m54-count',v);if(k==='board')sset('m54-board',v);$$('.btn',sg).forEach(y=>y.classList.remove('sel'));x.classList.add('sel')}));
  $('#setOk').onclick=()=>closeOv();showOv('ovSet');
}
function openPause(){
  setPaused(true);const b=$('#pauseBody');
  b.innerHTML=`<h2>⏸ 休息一下</h2><button class="btn g big" id="psGo">繼續</button><button class="btn" id="psHome">回地圖</button>`;
  $('#psGo').onclick=()=>{closeOv();setPaused(false);qmReplay()};$('#psHome').onclick=()=>{stopAll();go('home')};
  showOv('ovPause');
}

/* ================= 啟動 ================= */
function boot(){
  S.voice=sget('m54-voice',true);S.rate=sget('m54-rate',0.85);S.count=sget('m54-count',6);S.board=sget('m54-board',true);
  loadProf();syncVoice();initCover();
  $('#dkClass').onclick=()=>{ac();openClass()};$('#dkGroup').onclick=()=>{ac();openGroup()};$('#dkMe').onclick=()=>{ac();openMe(false)};$('#dkSet').onclick=()=>{ac();openSet()};
  $('#lvBack').onclick=()=>{if(!guard(300))return;stopAll();go('home')};
  $('#clsBack').onclick=()=>{if(!guard(300))return;stopAll();go('home')};
  $('#lvPause').onclick=()=>{if(!guard(300))return;openPause()};
  $('#lvListen').onclick=()=>{if(!guard(300))return;ac();qmReplay()};
  $$('#clsTabs .btn').forEach(b=>b.onclick=()=>{if(!guard(300))return;clsTab(+b.getAttribute('data-t'))});
  $('#exAgain').onclick=()=>{if(!guard(300))return;if(EXQ)showExplain(EXQ,EXO||{})};
  $('#exClose').onclick=()=>{if(!guard(300))return;closeExplain()};
  $('#exPause').onclick=()=>{if(!guard(300))return;exTogglePause()};
  $('#exNext').onclick=()=>{if(!guard(300))return;exNext()};
  // 從 LINE 轉到外部瀏覽器後，直接進地圖
  const sp=new URLSearchParams(location.search);
  if(sp.get('openExternalBrowser')==='1'&&sp.has('ch')){S.prof={n:sp.get('nm')||'',c:Math.min(CHARS.length-1,+sp.get('ch')||0)};S.pts=sget('m54-pts-'+(S.prof.n||'_'),0);saveProf();go('home')}
  syncChips();
  try{window.speechSynthesis&&speechSynthesis.getVoices()}catch(e){}
}
boot();
</script>

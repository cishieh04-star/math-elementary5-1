<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>合歡山小數探險｜五年級數學 多位小數與加減</title>
<style>
:root{--u:min(4.4vw,2.7vh,23px);--ink:#22313f;--ink2:#566573;--ok:#2fb86b;--bad:#e5484d;--y:#ffd166;--g:#6fcf97;--or:#ff8c42;--tr:#b07a45;
 --p0:#ffd54f;--p1:#ffc9a8;--pm1:#9fcdfb;--pm2:#ffa8a8;--pm3:#a6e3b4;--pm4:#cdb2ff;--pm5:#ffbfe3;--p2:#fff0b3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#cfeaff;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:var(--u);touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(#bfe6ff 0%,#e9f7ff 55%,#e6f6dc 100%)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(var(--u)*.6) calc(var(--u)*.8)}
.scr.on{display:flex}
.btn{background:#fff;border-radius:calc(var(--u)*1.1);padding:calc(var(--u)*.6) calc(var(--u)*1);font-weight:800;box-shadow:0 .25em 0 #c3cfdf;font-size:calc(var(--u)*1.05);min-height:calc(var(--u)*2.8);line-height:1.15}
.btn:active{transform:translateY(.15em);box-shadow:0 .1em 0 #c3cfdf}
.btn.y{background:var(--y);box-shadow:0 .25em 0 #d6a63a}
.btn.g{background:var(--g);box-shadow:0 .25em 0 #3f9b67;color:#0b3d1b}
.btn.o{background:#ffb37a;box-shadow:0 .25em 0 #d9803f}
.btn.b{background:#a9d4ff;box-shadow:0 .25em 0 #6aa2e0}
.btn.big{font-size:calc(var(--u)*1.45);padding:calc(var(--u)*.8) calc(var(--u)*1.2)}
.btn.pulse{animation:pulse 1.1s ease-in-out infinite}
.btn:disabled{opacity:.45;filter:grayscale(.6)}
.bar{display:flex;gap:calc(var(--u)*.45);align-items:center;flex:none}
.bar .btn{padding:calc(var(--u)*.35) calc(var(--u)*.7);font-size:calc(var(--u)*.92);min-height:calc(var(--u)*2.4);white-space:nowrap}
.bar .sp{flex:1;min-width:0}
.ttl{font-weight:900;font-size:calc(var(--u)*1.3);line-height:1.15}
.sub{font-size:calc(var(--u)*.85);color:var(--ink2)}
@keyframes pulse{50%{transform:scale(1.04)}}
@keyframes pop{40%{transform:scale(1.14)}}
@keyframes shake{20%{transform:translateX(-.3em)}60%{transform:translateX(.3em)}}
@keyframes popin{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.hide{display:none!important}

/* ===== 封面 ===== */
#cover{align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*1);background:linear-gradient(#7cc4ff 0%,#cfeeff 45%,#fff 46%,#e8f6ff 52%,#7dc383 53%,#3f8f5a 100%);overflow:hidden}
#cover .peak{font-size:calc(var(--u)*6);line-height:1;filter:drop-shadow(0 .1em 0 #fff8);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-.15em)}}
#cover h1{margin:0;font-size:calc(var(--u)*2.5);line-height:1.15;color:#1d3b5c;text-shadow:0 .07em 0 #fff,0 0 .3em #fff}
#cover .sub{color:#1d3b5c;font-weight:800;font-size:calc(var(--u)*1.05);background:#ffffffcc;border-radius:99px;padding:.2em .9em}
#cover .hint{font-weight:900;font-size:calc(var(--u)*1.6);background:#fff;border-radius:99px;padding:.45em 1.5em;box-shadow:0 .22em 0 #2f6b4f;animation:pulse 1.4s infinite;color:#2f6b4f}
#cover .vb{position:absolute;top:calc(var(--u)*.6);right:calc(var(--u)*.8)}
.cloud{position:absolute;font-size:calc(var(--u)*3);opacity:.85;animation:drift 46s linear infinite;pointer-events:none}
@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}

/* ===== 首頁：登山地圖 ===== */
#home{gap:calc(var(--u)*.4);background:linear-gradient(#a9dcff 0%,#dff3ff 30%,#bfe5b5 55%,#7fbf7a 100%)}
#home .bar .ttl{color:#1d3b5c;white-space:nowrap;font-size:min(calc(var(--u)*1.3),5vw);overflow:hidden;text-overflow:ellipsis}
#home .bar>div:first-child{flex:1 1 auto;overflow:hidden}
#home .bar .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){#home .bar .vbtn{padding:calc(var(--u)*.3) calc(var(--u)*.45);font-size:calc(var(--u)*.8)}#home .bar .ttl .em{display:none}}
#mtn{flex:1;min-height:0;display:flex;gap:calc(var(--u)*.6);position:relative}
#mtn::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 18% at 50% 2%,#ffffffcc,transparent 70%);pointer-events:none}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column-reverse;gap:calc(var(--u)*.32);position:relative}
.mcol::after{content:'';position:absolute;left:50%;top:2%;bottom:2%;width:.35em;transform:translateX(-50%);background:repeating-linear-gradient(#b07a45 0 .6em,transparent .6em 1.1em);z-index:0;border-radius:9px;opacity:.6}
.st{position:relative;z-index:1;flex:1;min-height:0;display:flex;align-items:center;gap:calc(var(--u)*.5);background:#fffdf5;border-radius:calc(var(--u)*.7);padding:0 calc(var(--u)*.6);text-align:left;box-shadow:0 .2em 0 #8fae7f;width:88%}
.st:nth-child(odd){align-self:flex-start}.st:nth-child(even){align-self:flex-end}
.st.done{background:#fff2b8;box-shadow:0 .2em 0 #d1a63a}
.st.boss{background:#e8f1ff;box-shadow:0 .2em 0 #7d9ccc}
.st.boss.done{background:#d7f5df}
.st .no{font-weight:900;font-size:calc(var(--u)*.95);width:calc(var(--u)*2);height:calc(var(--u)*2);display:grid;place-items:center;background:#2f6b4f;color:#fff;border-radius:50%;flex:none}
.st.boss .no{background:#3b5ba8}
.st .ic{font-size:calc(var(--u)*1.45);flex:none}
.st .nm{flex:1;min-width:0;font-weight:900;font-size:calc(var(--u)*1.02);line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .nm small{display:block;font-weight:600;font-size:calc(var(--u)*.7);color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.st .sr{font-size:calc(var(--u)*.85);letter-spacing:-.12em;flex:none}
.st .me{position:absolute;right:-.2em;top:-.55em;font-size:calc(var(--u)*1.5);animation:float 1.6s ease-in-out infinite}
.st:active{transform:translateY(.12em)}
@media (max-height:520px){.st .nm small{display:none}}
.dock{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*.45)}
.dock .btn{padding:calc(var(--u)*.4) calc(var(--u)*.15);font-size:calc(var(--u)*.88);display:flex;flex-direction:column;align-items:center;gap:.1em}
.dock .btn span{font-size:calc(var(--u)*1.45);line-height:1}

/* ===== 角色與點數 ===== */
.chip{display:flex;align-items:center;gap:.25em;background:#fff8d6;border-radius:99px;padding:.15em .6em .15em .3em;box-shadow:0 .15em 0 #e2c04d;font-weight:900;font-size:calc(var(--u)*.95);white-space:nowrap;position:relative}
.chip .av{font-size:1.45em;line-height:1;display:inline-block}
.chip .av.jump{animation:avj .6s}
@keyframes avj{30%{transform:translateY(-.5em) scale(1.25)}60%{transform:none}}
.chip .pt{color:#b86e00}
.chip .nmx{max-width:4.5em;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.chip .nmx{display:none}}
.ptfly{position:absolute;left:50%;top:-.3em;transform:translateX(-50%);font-weight:900;color:#e8590c;white-space:nowrap;pointer-events:none;animation:ptfly 1.3s ease-out forwards;text-shadow:0 0 4px #fff,0 0 4px #fff;z-index:30}
@keyframes ptfly{0%{opacity:0;transform:translate(-50%,.6em)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-2.4em)}}
.chgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*.4)}
.chb{background:#f2f6fb;border-radius:calc(var(--u)*.7);padding:calc(var(--u)*.3) 0;display:flex;flex-direction:column;align-items:center;box-shadow:0 .15em 0 #c3cfdf;font-weight:800;font-size:calc(var(--u)*.78)}
.chb span{font-size:calc(var(--u)*2.1);line-height:1.1}
.chb.sel{background:#fff1a8;outline:.2em solid #ffb400}
.nmrow{display:flex;align-items:center;gap:.5em;font-weight:800;justify-content:center}
.nmrow input{font:inherit;font-weight:800;border:.13em solid #9fb3cc;border-radius:.5em;padding:.25em .5em;width:8em;user-select:text;-webkit-user-select:text;text-align:center}

/* ===== 關卡畫面 ===== */
.row2{display:flex;align-items:center;gap:calc(var(--u)*.5);flex:none;margin-top:calc(var(--u)*.4)}
.prog{display:flex;gap:calc(var(--u)*.28);flex:1;min-width:0;align-items:center}
.prog i{flex:1;height:calc(var(--u)*.75);border-radius:99px;background:#fff;box-shadow:0 0 0 .12em #b9c9dc inset}
.prog i.ok{background:var(--ok)}.prog i.bad{background:#ffb347}.prog i.cur{background:var(--y);animation:pulse 1s infinite}
#qwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*.45);margin:calc(var(--u)*.45) auto 0;width:100%;max-width:calc(var(--u)*32)}
.card{background:#fff;border-radius:calc(var(--u)*1);box-shadow:0 .2em 0 #c3cfdf;padding:calc(var(--u)*.6) calc(var(--u)*.8)}
.instr{font-size:calc(var(--u)*.8);color:#fff;background:#2f6b4f;border-radius:99px;padding:.15em .8em;align-self:flex-start;font-weight:800;flex:none}
.stem{font-size:calc(var(--u)*1.35);font-weight:800;line-height:1.38;text-align:center;flex:none}
.stem .num{color:#c2410c;white-space:nowrap}
.stem.long{font-size:calc(var(--u)*1.12);text-align:left}
.fig{flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden;flex-direction:column;gap:calc(var(--u)*.35)}
.fig.none{flex:0 0 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.5);flex:none;margin-top:auto}
.opts.one{grid-template-columns:1fr}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{position:relative;border-radius:calc(var(--u)*1);padding:calc(var(--u)*.5) calc(var(--u)*1.5);font-weight:900;font-size:calc(var(--u)*1.4);min-height:calc(var(--u)*3.3);box-shadow:0 .22em 0 rgba(0,0,0,.18);color:#1d2b3a;line-height:1.2;transition:transform .12s}
.opt.long{font-size:calc(var(--u)*1.05)}
.opt.c0{background:#ffe27a}.opt.c1{background:#a9d4ff}.opt.c2{background:#ffbcbc}.opt.c3{background:#b0e8b8}
.opt:active{transform:translateY(.15em)}
.opt.hot{outline:.25em solid #fff;box-shadow:0 0 0 .45em #ff9f1c;z-index:2}
.opt.off{opacity:.35;pointer-events:none;filter:grayscale(.7)}
.opt.ok{background:var(--ok)!important;color:#fff;animation:pop .5s}
.opt.no{animation:shake .4s}
.opt .nb{position:absolute;left:.45em;top:50%;transform:translateY(-50%);width:1.5em;height:1.5em;border-radius:50%;background:#fff9;font-size:.6em;display:grid;place-items:center;font-weight:900}
.fb{flex:none;min-height:calc(var(--u)*2);text-align:center;font-weight:800;font-size:calc(var(--u)*1.02);color:var(--ink2);display:flex;align-items:center;justify-content:center;line-height:1.25}
.fb.ok{color:var(--ok)}.fb.bad{color:#c2410c}
.helpb{align-self:center;flex:none;padding:calc(var(--u)*.3) calc(var(--u)*1.1)!important;min-height:calc(var(--u)*2.2)!important;font-size:calc(var(--u)*.98)!important;background:#fff3c4!important;box-shadow:0 .22em 0 #e0b84a!important}
.bignum{font-size:calc(var(--u)*2.8);font-weight:900;letter-spacing:.06em;background:#fff;border-radius:calc(var(--u)*.8);padding:.05em .5em;box-shadow:0 .18em 0 #c3cfdf}
.bignum u{color:#e03131;text-decoration-thickness:.12em;text-underline-offset:.15em}
.cmpbox{display:flex;gap:calc(var(--u)*.6);justify-content:center;align-items:stretch;width:100%}
.cmpbox .side{flex:1;background:#e6f1ff;border-radius:calc(var(--u)*.9);box-shadow:0 .2em 0 #c3cfdf;display:grid;place-items:center;padding:calc(var(--u)*.6) .2em;font-weight:900;font-size:calc(var(--u)*1.75);text-align:center;line-height:1.2;word-break:break-all}
.cmpbox .side.r{background:#ffeadf}
.cmpbox .side small{display:block;font-size:.5em;color:var(--ink2);font-weight:800}
.cmpbox .mid{display:grid;place-items:center;font-size:calc(var(--u)*2.2);font-weight:900;color:#c2410c;min-width:1.2em}
.mpick{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*.45);flex:none}
.mpick.n3{grid-template-columns:repeat(3,1fr)}.mpick.n2{grid-template-columns:repeat(2,1fr)}.mpick.n4{grid-template-columns:repeat(4,1fr)}
.mp{background:#fff;border-radius:calc(var(--u)*.8);font-weight:900;font-size:calc(var(--u)*1.35);min-height:calc(var(--u)*2.9);box-shadow:0 .2em 0 #b8c4dc;position:relative;padding:0 .2em}
.mp.dg{font-size:calc(var(--u)*1.8)}
.mp.sel{background:#ffe27a;box-shadow:0 .2em 0 #d6a63a;outline:.2em solid #ff9f1c}
.mp.sel::after{content:'⭕';position:absolute;right:.1em;top:.05em;font-size:.55em}
.mp.ok{background:#b2f2bb;outline:.2em solid var(--ok)}
.mp.miss{outline:.2em dashed var(--ok)}
.mp.wr{background:#ffd6d6;outline:.2em solid var(--bad)}
.mp.hot{box-shadow:0 0 0 .3em #ff9f1c}
.gobtn{flex:none}
.slots{display:flex;gap:calc(var(--u)*.35);justify-content:center;flex-wrap:wrap;align-items:center}
.slot{min-width:calc(var(--u)*4);height:calc(var(--u)*2.6);border-radius:calc(var(--u)*.6);background:#fff;border:.15em dashed #8aa;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*1.2);padding:0 .3em}
.slot.f{background:#fff3c4;border-style:solid;border-color:#ffb400;animation:pop .4s}
.slots .lt{font-weight:900;color:#c2410c;font-size:calc(var(--u)*1.3)}
.info{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.35);justify-content:center}
.inf{display:flex;align-items:center;gap:.35em;background:#fff;border-radius:calc(var(--u)*.7);padding:.2em .6em;box-shadow:0 .15em 0 #c3cfdf;font-weight:800;font-size:calc(var(--u)*.98)}
.inf span{font-size:1.4em}.inf b{color:#c2410c;white-space:nowrap}
.tbl{border-collapse:collapse;font-weight:800;font-size:calc(var(--u)*.95)}
.tbl td,.tbl th{border:.1em solid #9db3d9;padding:.2em .5em;text-align:center;background:#fff}
.tbl th{background:#e4f2e8}
.stepn{align-self:center;font-weight:900;color:#2f6b4f;background:#e4f5e9;border-radius:99px;padding:.1em .8em;font-size:calc(var(--u)*.9);flex:none}

/* ===== 定位板 / 直式 ===== */
.vg{--cw:min(calc(var(--u)*2.35),calc((100vw - 4em)/(var(--n) + 3)));--lw:auto;display:grid;align-items:center;justify-content:center;background:#fff;border-radius:calc(var(--u)*.8);box-shadow:0 .2em 0 #c3cfdf;padding:calc(var(--u)*.3) calc(var(--u)*.6) calc(var(--u)*.45);row-gap:.06em;flex:none}
#exBody .vg{--cw:min(calc(var(--u)*3),calc((100vw - 5em)/(var(--n) + 3)))}
#exBody .vg.sm{--cw:min(calc(var(--u)*2.3),calc((100vw - 5em)/(var(--n) + 3)))}
@media (min-aspect-ratio:13/10){#exBody .vg{--cw:min(calc(var(--u)*2.8),calc((88vw - 6em)/(var(--n) + 3)),8.5vh)}#exBody .vg.sm{--cw:min(calc(var(--u)*2.2),calc((88vw - 6em)/(var(--n) + 3)),7vh)}}
.vg.sm{--cw:min(calc(var(--u)*1.8),calc((100vw - 4em)/(var(--n) + 3)))}
.vg i{font-style:normal;text-align:center;font-weight:900;border-radius:.2em;transition:background .25s,color .25s,opacity .3s}
.vg .c.h{font-size:calc(var(--cw)*.3);line-height:1.05;color:#4a5a6e;font-weight:800;padding:.25em 0 .2em;border-radius:.35em .35em 0 0;min-height:2.3em;display:flex;align-items:flex-end;justify-content:center}
.vg .c.h svg{display:block;margin:0 auto .15em;width:1.5em;height:1.5em}
.vg .c.m{font-size:calc(var(--cw)*.42);color:#e03131;min-height:1.2em;line-height:1.2}
.vg .c.m.tag{font-size:calc(var(--cw)*.28);color:#2f6b4f}
.vg .c.n,.vg .c.res{font-size:calc(var(--cw)*.78);line-height:1.22}
.vg .dt.n,.vg .dt.res{font-size:calc(var(--cw)*.78);line-height:1.22;color:#c2410c}
.vg .sg.n{font-size:calc(var(--cw)*.7);color:#c2410c}
.vg .lb{font-size:calc(var(--cw)*.34);font-weight:800;color:#566573;white-space:nowrap;padding-right:.4em;text-align:right}
.vg .lb.res{color:#2f6b4f}
.vg .c.pd{color:#ff8c42}
.vg .c.pd.hid{opacity:0}
.vg .c.x{color:#a9b2c3;text-decoration:line-through;text-decoration-color:#e03131;text-decoration-thickness:.1em}
.vg .c.fade{opacity:.18}
.vg .c.dim{color:#b8c2d0}
.vg .ln{grid-column:2/-1;height:.18em;background:#1d2b3a;border-radius:9px;margin:.12em 0}
.vg .c.res{color:#2f6b4f}
.vg .c.an{border:.12em dashed #9aa9c2;margin:.05em;background:#fafcff;height:calc(var(--cw)*1.05);display:grid;place-items:center;color:#1d2b3a}
.vg .c.an.cur{border:.16em solid #ff9f1c;background:#fff4d6;animation:pulse 1s infinite}
.vg .c.an.okc{border:.12em solid #2fb86b;background:#e3f8ea;color:#0b6b36}
.vg .c.an.rev{border:.12em solid #ff9f1c;background:#fff1d0;color:#c2410c}
.vg .c.an.bad{animation:shake .4s;background:#ffe0e0}
.vg .c.box{color:#ff7a00;background:#fff3d6;outline:.1em dashed #ff9f1c}
.vg .hl{background:#fff1a8!important}
.vg .hl2{background:#d3f9d8!important}
.vg .hlr{background:#ffd6d6!important}
.vg .pop{animation:pop .5s}
.vg .c.p0,.vg .c.p1,.vg .c.p2{--pc:var(--p0)}
.vg .c.h.p0{background:var(--p0)}.vg .c.h.p1{background:var(--p1)}.vg .c.h.p2{background:var(--p2)}.vg .c.h.pm1{background:var(--pm1)}.vg .c.h.pm2{background:var(--pm2)}.vg .c.h.pm3{background:var(--pm3)}.vg .c.h.pm4{background:var(--pm4)}.vg .c.h.pm5{background:var(--pm5)}
.pvcap{font-weight:900;font-size:calc(var(--u)*.8);color:#2f6b4f;background:#e4f5e9;border-radius:99px;padding:0 .7em;flex:none}
.fig .vg.sm{flex:none}
.vtip{font-weight:900;font-size:calc(var(--u)*1.1);text-align:center;min-height:2.6em;line-height:1.3;color:#1d2b3a;display:block;flex:none;background:#fff;border-radius:calc(var(--u)*.7);padding:.15em .6em;box-shadow:0 .15em 0 #c3cfdf}
.vtip b{color:#c2410c}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*.4);flex:none;margin-top:auto}
.pad .k{background:#fff;border-radius:calc(var(--u)*.8);font-weight:900;font-size:calc(var(--u)*1.7);min-height:calc(var(--u)*2.9);box-shadow:0 .2em 0 #b8c4dc}
.pad .k:active{transform:translateY(.15em)}
.pad .k.hp{grid-column:span 5;background:#fff3c4;font-size:calc(var(--u)*1.05);box-shadow:0 .2em 0 #e0b84a;min-height:calc(var(--u)*2.3)}

/* 籌碼板 */
.chipsb{display:flex;gap:calc(var(--u)*.25);background:#fff;border-radius:calc(var(--u)*.8);box-shadow:0 .2em 0 #c3cfdf;padding:calc(var(--u)*.3)}
.cbc{display:flex;flex-direction:column;align-items:center;min-width:calc(var(--u)*3.4);border-radius:.5em;overflow:hidden}
.cbc .ch{font-size:calc(var(--u)*.72);font-weight:800;width:100%;text-align:center;padding:.2em 0;line-height:1.1}
.cbc .cv{font-size:calc(var(--u)*.7);color:#566573;font-weight:800}

<script>
'use strict';
/* ================= 基本工具 ================= */
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.prototype.slice.call((r||document).querySelectorAll(s));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
const uniq=a=>Array.from(new Set(a));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let _store=null;try{_store=window.localStorage;_store.getItem('x')}catch(e){_store=null}
function sget(k,d){try{const v=_store&&_store.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sset(k,v){try{_store&&_store.setItem(k,JSON.stringify(v))}catch(e){}}

/* ================= 小數（用字串精確計算）================= */
const P10=[1,10,100,1e3,1e4,1e5,1e6,1e7];
function dp(s){s=String(s);const i=s.indexOf('.');return i<0?0:s.length-i-1}
function intLen(s){return String(s).split('.')[0].length}
function toI(s,D){const n=String(s).split('.');const fp=(n[1]||'').padEnd(D,'0').slice(0,D);return parseInt(n[0],10)*P10[D]+(D?parseInt(fp,10):0)}
function fromI(n,D,keep){let s=String(Math.abs(n)).padStart(D+1,'0');let r=D?s.slice(0,s.length-D)+'.'+s.slice(-D):s;if(!keep&&D)r=r.replace(/0+$/,'').replace(/\.$/,'');return (n<0?'-':'')+r}
function trimZ(s){s=String(s);return s.indexOf('.')<0?s:s.replace(/0+$/,'').replace(/\.$/,'')}
function addS(){const xs=Array.prototype.slice.call(arguments);const D=Math.max.apply(null,xs.map(dp));return fromI(xs.reduce((t,x)=>t+toI(x,D),0),D)}
function subS(a,b){const D=Math.max(dp(a),dp(b));return fromI(toI(a,D)-toI(b,D),D)}
function cmpS(a,b){const D=Math.max(dp(a),dp(b));return Math.sign(toI(a,D)-toI(b,D))}
function padD(s,k){s=String(s);const d=dp(s);if(d>=k)return s;return (d?s:s+'.')+'0'.repeat(k-d)}
function roundS(s,k){const D=dp(s);if(D<=k)return padD(s,k);const n=toI(s,D),f=P10[D-k];return fromI(Math.floor((n+f/2)/f),k,true)}
function truncS(s,k){const D=dp(s);if(D<=k)return padD(s,k);return fromI(Math.floor(toI(s,D)/P10[D-k]),k,true)}
function mulC(c,u){return fromI(c*toI(u,dp(u)),dp(u))} // c 個 u

/* ===== 數字讀法（國語）===== */
const DG=['零','一','二','三','四','五','六','七','八','九'];
function zh4(n){const d=[Math.floor(n/1000),Math.floor(n/100)%10,Math.floor(n/10)%10,n%10],u=['千','百','十',''];let s='',z=false;for(let i=0;i<4;i++){if(d[i]===0){if(s)z=true;continue}if(z){s+='零';z=false}s+=DG[d[i]]+u[i]}return s}
function zhInt(n){n=+n;if(n===0)return '零';const w=Math.floor(n/10000),r=n%10000;let s='';if(w){s=zh4(w)+'萬';if(r&&r<1000)s+='零'}s+=zh4(r);if(s.indexOf('一十')===0)s=s.slice(1);return s}
function zhDec(m){m=String(m);const a=m.split('.');let ip=a[0];let s=ip.length>1&&ip[0]==='0'?ip.split('').map(c=>DG[+c]).join(''):(ip.length>9?ip.split('').map(c=>DG[+c]).join(''):zhInt(+ip));if(a.length>1)s+='點'+a[1].split('').map(c=>DG[+c]).join('');return s}
// 含 □ 的數也能唸
function numSay(s){s=String(s);const a=s.split('.');const ip=a[0];let r=/[□☆]/.test(ip)?ip.split('').map(c=>/\d/.test(c)?DG[+c]:'空格').join(''):zhInt(+ip);if(a.length>1)r+='點'+a[1].split('').map(c=>/\d/.test(c)?DG[+c]:'空格').join('，');return r}
function digitsSay(s){return String(s).split('').map(c=>c==='.'?'小數點':/\d/.test(c)?DG[+c]:c).join('、')}
function spoken(s){
  s=String(s).replace(/(^|[^第\d.])2(?=[個條塊位隊顆杯張種站])/g,'$1兩');
  return s.replace(/□|☆|＿+|\(\s*\)|（\s*）/g,'空格').replace(/\d+(?:\.\d+)?/g,m=>zhDec(m)).replace(/[＋+]/g,'加').replace(/[－−]/g,'減').replace(/＝/g,'等於').replace(/＞|>/g,'大於').replace(/＜|</g,'小於').replace(/≈/g,'約等於').replace(/[→⇒]/g,'，').replace(/[①②③④]/g,'').replace(/\s+/g,' ');
}

const TTS={ok:'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined',gen:0,
  stop(){this.gen++;try{this.ok&&speechSynthesis.cancel()}catch(e){}},
  est(t){return Math.max(600,String(t).length*(S.rate<0.75?330:S.rate<0.95?265:210))/(this.mult||1)},
  one(text,gen,done){
    if(gen!==this.gen)return;
    let fin=false;const f=()=>{if(fin)return;fin=true;clearTimeout(tm);done&&done()};
    const tm=setTimeout(f,this.est(text)*1.8+1200);
    try{const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=Math.max(0.55,S.rate*(TTS.mult||1));u.pitch=1.05;u.onend=f;u.onerror=f;speechSynthesis.speak(u)}catch(e){clearTimeout(tm);setTimeout(f,this.est(text))}
  }
};
function speakSeq(items,onAll,gap){
  TTS.stop();const gen=TTS.gen;gap=gap==null?280:gap;let i=0;
  const next=()=>{
    if(gen!==TTS.gen)return;
    if(i>=items.length){onAll&&onAll();return}
    const it=items[i++],t=typeof it==='string'?it:it.t,on=typeof it==='string'?null:it.on;
    on&&on();
    const txt=spoken(t);
    if(!S.voice||!TTS.ok||!txt.trim()){later(()=>gen===TTS.gen&&next(),txt.trim()?(S.voice?Math.min(4000,TTS.est(txt)*0.6):600):50);return}
    TTS.one(txt,gen,()=>later(()=>gen===TTS.gen&&next(),gap));
  };
  if(CLK.paused)return;
  next();
}
function say(t,cb){speakSeq([t],cb)}

function noise(t0,d,vol,hp){const c=ac();if(!c||!S.sfx)return;try{const b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),da=b.getChannelData(0);for(let i=0;i<da.length;i++)da[i]=(Math.random()*2-1)*(1-i/da.length);const s=c.createBufferSource();s.buffer=b;const g=c.createGain();g.gain.value=vol||0.2;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;s.connect(f);f.connect(g);g.connect(c.destination);s.start(c.currentTime+t0)}catch(e){}}

function blockSVG(p,sz){ // 位值小圖示

  g.style.gridTemplateColumns=tc.join(' ');g.style.setProperty('--n',String(places.length+1));
  const add=(cls,txt,p,r)=>{const e=document.createElement('i');e.className=cls;if(p!=null)e.setAttribute('data-p',p);if(r!=null)e.setAttribute('data-r',r);e.innerHTML=txt==null?'':txt;g.appendChild(e);return e};
  const line=(kind,r,lab,sign,fn)=>{add('lb '+kind,lab||'',null,r);add('sg '+kind,sign||'',null,r);places.forEach(p=>{if(p===-1)add('dt '+kind,fn('dot'),'dot',r);const v=fn(p);add('c '+kind+(v&&v.cls?' '+v.cls:''),v&&v.t!=null?v.t:(v==null?'':v),p,r)})};

  if(opt.mark!==false) line('m','m','','',()=> '');
  rows.forEach((r,ri)=>{
    const s=String(r.s),hasDot=s.indexOf('.')>=0||D>0&&opt.padAll;
    line('n',ri,r.lab,r.sign,p=>{
      if(p==='dot')return hasDot||(D>0&&r.pad)?'.':'';
      const a=s.split('.'),ip=a[0],fp=a[1]||'';

  if(opt.res) line('res','x',opt.resLab||'',opt.resSign||'',p=>p==='dot'?'':(opt.fill?{t:'',cls:''}:''));

    col:p=>$$(`[data-p="${p}"]`,g),
    hl(p,cls){$$('.'+(cls||'hl'),g).forEach(e=>e.classList.remove(cls||'hl'));if(p!=null)api.col(p).forEach(e=>e.classList.add(cls||'hl'))},
    hlCell(r,p,cls){const e=api.cell(r,p);e&&e.classList.add(cls||'hl')},

/* ===== 直式模型 ===== */
function vcModel(nums,op){
  nums=nums.map(String);
  const D=Math.max.apply(null,nums.map(dp));
  const ints=nums.map(s=>toI(s,D));
  const rI=op==='+'?ints.reduce((a,b)=>a+b,0):ints[0]-ints[1];
  const res=fromI(rI,D,true);
  const I=Math.max.apply(null,nums.map(intLen).concat([intLen(res)]));
  const places=[];for(let p=-D;p<=I-1;p++)places.push(p); // 由右往左
  const cols=[];
  if(op==='+'){
    let c=0;
    places.forEach(p=>{
      const ds=nums.map(n=>{const d=digAt(n,p);return d==null&&p<0?0:d});
      const terms=ds.filter(d=>d!=null);
      const sum=terms.reduce((a,b)=>a+b,0)+c;
      cols.push({p,terms,cin:c,sum,w:sum%10,cout:Math.floor(sum/10)});c=Math.floor(sum/10);
    });
  }else{
    const cur={};places.forEach(p=>{const d=digAt(nums[0],p);cur[p]=d==null?(p<0?0:null):d});
    places.forEach(p=>{
      const b0=digAt(nums[1],p),b=b0==null?(p<0||cur[p]!=null?0:null):b0;
      const t0=cur[p];
      if(t0==null){cols.push({p,skip:true});return}
      const col={p,t0,b:b==null?0:b,bShow:b0!=null||p<0,borrow:null};
      if(t0<col.b){
        let q=p+1;while(cur[q]===0)q++;
        const ch=[];cur[q]-=1;ch.push({p:q,v:cur[q]});
        for(let r=q-1;r>p;r--){cur[r]=9;ch.push({p:r,v:9})}
        cur[p]=t0+10;ch.push({p,v:cur[p]});
        col.borrow={from:q,chain:ch};
      }
      col.top=cur[p];col.w=col.top-col.b;cols.push(col);
    });
  }
  const rl=intLen(res); // 結果的整數位數
  return {nums,op,D,I,res,resShort:trimZ(res),cols,rl};
}
function colTip(m,c){ // 給這一位的說明
  const nm=PN[c.p];
  if(m.op==='+'){
    let s=`${nm}：${c.terms.join(' ＋ ')}`;if(c.cin)s+=` ＋ 進位的 ${c.cin}`;
    if(!c.terms.length)s=`${nm}：只有進位的 ${c.cin}`;
    return s+` ＝ <b>${c.sum}</b>`+(c.sum>=10?`，寫 <b>${c.w}</b>，進 ${c.cout} 到${PN[c.p+1]}`:'');
  }
  if(c.borrow){const chainZero=c.borrow.chain.length>2;return `${nm}：${c.t0} 不夠減 ${c.b}，向${PN[c.borrow.from]}借 1`+(chainZero?'（中間的 0 變成 9）':'')+`，變成 ${c.top}。${c.top} － ${c.b} ＝ <b>${c.w}</b>`}
  return `${nm}：${c.t0} － ${c.b} ＝ <b>${c.w}</b>`;
}
function colAsk(m,c){ // 作答時的提示（不給答案）
  const nm=PN[c.p];
  if(m.op==='+'){let s=`${nm}：${c.terms.join(' ＋ ')}`;if(c.cin)s+=` ＋ 進位的 ${c.cin}`;if(!c.terms.length)s=`${nm}：進位的 ${c.cin}`;return s+' ＝ ？'}
  if(c.borrow)return `${nm}：${c.t0} 不夠減，借 1 變 ${c.top}。${c.top} － ${c.b} ＝ ？`;
  return `${nm}：${c.t0} － ${c.b} ＝ ？`;
}
function stripB(s){return String(s).replace(/<[^>]+>/g,'')}
// 直式表格（給模型用）
function vcGrid(m,o){
  o=o||{};
  const rows=m.nums.map((s,i)=>({s,pad:true,padShow:!!o.padShow,sign:i===m.nums.length-1?(m.op==='+'?'＋':'－'):'',lab:o.labs?o.labs[i]:''}));
  return mkGrid(rows,{D:m.D,I:m.I,line:true,res:true,fill:o.fill,sm:o.sm,resLab:o.resLab||''});
}
// 把直式動畫加進步驟
function vcSteps(m,G,steps,o){
  o=o||{};const unit=o.unit||'';
  const needPad=m.nums.some(n=>dp(n)<m.D);
  steps.push({t:`用直式算：先把<b>小數點對齊</b>，個位對個位、十分位對十分位。`,fn:()=>{G.hl('dot');later(()=>G.clear(),1600)}});
  if(needPad)steps.push({t:'小數位數比較少的，後面<b>補 0</b>，上下一樣長比較好算。',fn:()=>{G.showPads();m.nums.forEach((n,i)=>{if(dp(n)<m.D){const e=G.el.querySelector(`.lb[data-r="${i}"]`);if(e&&!e.textContent)e.innerHTML='<span style="color:#ff8c42">補0→</span>'}})}});
  else G.showPads();
  steps.push({t:'從最右邊的'+PN[-m.D]+'開始，一位一位往左算。',fn:()=>{G.hl(-m.D)}});
  m.cols.forEach(c=>{
    if(c.skip)return;
    const p=c.p;
    if(p>=m.rl&&c.w===0&&!(m.op==='+'&&c.sum))return; // 前面沒有數字
    steps.push({t:colTip(m,c),fn:()=>{
      G.hl(p);
      if(m.op==='-'&&c.borrow){G.lab('m','<span style="color:#e03131">借位</span>');c.borrow.chain.forEach(x=>{const e=G.cell(0,x.p);e&&e.classList.add('x');G.mark(x.p,String(x.v))})}
      G.lab('x','答案');G.setRes(p,String(c.w));
      if(m.op==='+'&&c.cout){G.lab('m','<span style="color:#e03131">進位</span>');G.mark(p+1,'+'+c.cout)}
    }});
  });
  // 整數部分補顯示（例：0.039 的 0）
  steps.push({t:`小數點也要對齊，直接點下來。答案是 <b>${m.res}${unit}</b>。`,fn:()=>{G.clear();G.resDot();for(let p=0;p<m.rl;p++){const e=G.cell('x',p);if(e&&!e.textContent)e.textContent=digAt(m.res,p)}const e=G.cell('x',0);if(e&&!e.textContent)e.textContent='0'}});
  if(m.res!==m.resShort)steps.push({t:`最後面的 0 可以省略，答案寫成 <b>${m.resShort}${unit}</b>。`,fn:()=>{for(let p=-m.D;p<0;p++){const d=digAt(m.res,p);if(d===0&&cmpS(truncS(m.res,-p-1),m.res)===0){const e=G.cell('x',p);e&&e.classList.add('fade')}}}});
}
</script>
<script>
/* ================= 解說引擎 ================= */
let EXGEN=0,EXQ=null,EXO=null;
function exAdd(pnl,html,cls){const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=html;pnl.appendChild(d);return d}
function exAddEl(pnl,el,cls){if(cls)el.classList.add(cls);pnl.appendChild(el);return el}
let EXR=null; // 解說播放狀態
// 解說最上面顯示的題目
function exQText(q,o){
  if(o&&o.qtext)return {html:'<b class="ql">📋 題目</b>'+esc(o.qtext),t:esc(o.qtext),say:o.qtext};
  if(!q||!q.stem)return null;
  let stem=q.stem,say=q.say||q.stem;
  if(q.type==='cmp'){stem=`${q.la||q.a}　和　${q.lb||q.b}，哪一邊比較大？`;say=stem}
  let opts='';
  if(q.type==='mc')opts=q.opts.map((x,i)=>`<span>${'①②③④⑤⑥'[i]} ${esc(x.t)}</span>`).join('');
  else if(q.type==='multi'&&q.items.length<=10)opts=q.items.map(x=>`<span>${esc(x)}</span>`).join('');
  else if(q.type==='tf'&&q.tfL)opts=q.tfL.map(x=>`<span>${esc(x)}</span>`).join('');
  else if(q.type==='order')opts=q.items.map(x=>`<span>${esc(x)}</span>`).join('');
  const sh=typeof stemHtml==='function'?stemHtml(stem):esc(stem);
  return {html:`<b class="ql">📋 題目</b><span class="qs">${sh}</span>${opts?`<div class="qo">${opts}</div>`:''}`,t:sh,say};
}
function showExplain(q,o){
  o=o||{};EXQ=q;EXO=o;EXGEN++;const gen=EXGEN;
  TTS.stop();clearExTimer();
  const steps=[];
  const box=$('#exBody');box.innerHTML='<div id="exIn"></div>';const pnl=$('#exIn');
  const _ap=pnl.appendChild.bind(pnl);pnl.appendChild=el=>{if(el&&el.setAttribute){el.setAttribute('data-s',String(steps.length));el.classList.add('exhide')}return _ap(el)};
  $('#exTtl').textContent=o.title||'🧭 嚮導教你做';
  const exs=Array.isArray(q.ex)?q.ex:[q.ex||{kind:'text',t:q.why||'想一想，再試一次。'}];
  const qb=$('#exQ'),qt=exQText(q,o);if(qt){qb.innerHTML=qt.html;qb.style.display=''}else{qb.innerHTML='';qb.style.display='none'}
  if(qt&&!o.noQSay)steps.push({t:'先看題目：'+qt.t,say:'先看題目。'+qt.say});
  if(o.intro)steps.push({t:o.intro});
  exs.forEach(e=>exBuild(e,pnl,steps,q));
  if(q.why&&!exs.some(e=>e.kind==='text'))steps.push({t:q.why});
  const cap=$('#exCap');cap.innerHTML='';
  $('#exClose').textContent=o.closeTxt||'我懂了';$('#exClose').classList.remove('pulse');
  $('#exNext').classList.remove('pulse');$('#exNext').disabled=false;$('#exNext').textContent='下一步';
  $('#exPause').textContent='暫停';
  $('#ovExp').classList.add('on');
  EXR={gen,steps,i:0,paused:false,busy:false};
  TTS.mult=0.85; // 解說唸慢一點
  exStep();
}
let _exT=null;function clearExTimer(){if(_exT){clearTimeout(_exT);_exT=null}}
function exStep(){
  const R=EXR;if(!R||R.gen!==EXGEN)return;clearExTimer();
  if(R.i>=R.steps.length){exEnd();return}
  const st=R.steps[R.i++];
  exShow(R.i-1);
  try{st.fn&&st.fn()}catch(e){console.error(e)}
  exFit();setTimeout(exFit,60);setTimeout(exFit,700);
  const cap=$('#exCap');$$('.ln',cap).forEach(x=>{if(!x.classList.contains('cur'))x.classList.add('gone')});$$('.ln.cur',cap).forEach(x=>x.classList.remove('cur'));
  const ln=document.createElement('div');ln.className='ln cur';ln.innerHTML=`<i>${R.i}</i><span>${st.t}</span>`;cap.appendChild(ln);
  cap.scrollTop=cap.scrollHeight;
  if(R.i>=R.steps.length){$('#exNext').disabled=true;$('#exNext').textContent='看完了';$('#exClose').classList.add('pulse')}
  const txt=stripB(st.say||st.t);R.busy=true;
  speakSeq([txt],()=>{R.busy=false;if(R.gen!==EXGEN)return;
    // 唸完後停一下，讓孩子看清楚再往下
    const rest=S.voice&&TTS.ok?2200:readWait(txt);
    if(!R.paused)_exT=setTimeout(()=>{if(!R.paused&&R.gen===EXGEN)exStep()},rest);
  });
}
// 只顯示講到的圖；放不下就把舊的收起來，再縮小到剛好放得下（不要出現捲軸）
function exShow(i){const pnl=$('#exIn');if(!pnl)return;const kids=Array.prototype.slice.call(pnl.children);const first=kids.length?Math.min.apply(null,kids.map(k=>+k.getAttribute('data-s'))):0;const lim=Math.max(i,first);
  kids.forEach(k=>{const s=+k.getAttribute('data-s');const on=s<=lim&&!k._gone;if(on&&k.classList.contains('exhide')){k.classList.remove('exhide');k.classList.add('exnew')}else if(!on)k.classList.add('exhide')})}
function exFit(){const box=$('#exBody'),pnl=$('#exIn');if(!box||!pnl)return;pnl.style.transform='translateY(-50%)';
  const H=box.clientHeight-6,W=box.clientWidth-6;
  let vis=Array.prototype.slice.call(pnl.children).filter(k=>!k.classList.contains('exhide'));
  // 太多就收起最舊的（同一組的標題一起收）
  while(pnl.offsetHeight>H&&vis.length>1){const s0=vis[0].getAttribute('data-s');const grp=vis.filter(k=>k.getAttribute('data-s')===s0);if(grp.length===vis.length)break;grp.forEach(k=>{k._gone=1;k.classList.add('exhide')});vis=vis.filter(k=>!k.classList.contains('exhide'))}
  const sc=Math.min(1,H/Math.max(1,pnl.offsetHeight),W/Math.max(1,pnl.scrollWidth));pnl.style.transform=sc<1?`translateY(-50%) scale(${sc.toFixed(3)})`:'translateY(-50%)'}
window.addEventListener('resize',()=>{if($('#ovExp').classList.contains('on'))exFit()});
function exEnd(){const R=EXR;if(!R)return;$('#exClose').classList.add('pulse');$('#exNext').disabled=true;$('#exNext').textContent='看完了'}
function exTogglePause(){const R=EXR;if(!R||R.gen!==EXGEN)return;R.paused=!R.paused;$('#exPause').textContent=R.paused?'繼續':'暫停';
  if(R.paused){clearExTimer();TTS.stop();R.busy=false}else{exStep()}}
function exNext(){const R=EXR;if(!R||R.gen!==EXGEN)return;TTS.stop();exStep()}
function closeExplain(){EXGEN++;clearExTimer();TTS.stop();TTS.mult=1;$('#ovExp').classList.remove('on');const o=EXO;EXO=null;EXR=null;o&&o.onClose&&o.onClose()}

function partsOf(s){ // 2.745 → ['2','0.7','0.04','0.005']
  s=String(s);const out=[];const D=dp(s),L=intLen(s);
  for(let p=L-1;p>=-D;p--){const d=digAt(s,p);if(d)out.push({p,d,v:p>=0?String(d*P10[p]):'0.'+'0'.repeat(-p-1)+d})}
  return out;
}
function partsSay(s){return partsOf(s).map(x=>`${x.d}個${unitOf(x.p)}`).join('、')}
function expandSteps(s,pnl,steps,lead){ // 直式：拆成每一位再加起來
  const ps=partsOf(s);if(ps.length<2)return;
  const lab=exAdd(pnl,`<span class="exlab">直式看一看：${s} 是怎麼合起來的</span>`,'wide');
  const m=vcModel(ps.map(x=>x.v),'+');
  const G=vcGrid(m,{padShow:false,labs:ps.map(x=>`${x.d}個${unitOf(x.p)}`),sm:true});
  G.el.classList.add('wide');pnl.appendChild(G.el);
  lab.style.opacity=.3;G.el.style.opacity=.3;
  steps.push({t:(lead||'')+`${s} 就是 ${ps.map(x=>x.v).join(' ＋ ')}，用直式一位一位加起來。`,fn:()=>{lab.style.opacity=1;G.el.style.opacity=1;G.showPads()}});
  steps.push({t:`每一位上下加起來，合起來就是 <b>${s}</b>。`,fn:()=>{m.cols.forEach(c=>{if(c.p<m.rl||c.w)G.setRes(c.p,String(c.w))});G.resDot();const e=G.cell('x',0);if(e&&!e.textContent)e.textContent='0'}});
}

/* ---- 各種解說 ---- */
const EXB={};
EXB.text=(e,pnl,steps)=>{if(e.pic)exAdd(pnl,`<div class="bigic" style="font-size:calc(var(--u)*3.5)">${e.pic}</div>`,'wide');(Array.isArray(e.t)?e.t:[e.t]).forEach(t=>steps.push({t}))};
// 位名
EXB.place=(e,pnl,steps)=>{
  const s=e.s,p=e.p,D=dp(s);
  const G=mkGrid([{s}],{D,I:intLen(s)});pnl.appendChild(G.el);G.el.classList.add('wide');
  steps.push({t:`把 <b>${s}</b> 放進定位板，每一個數字住在自己的位置。`});
  steps.push({t:'小數點後面：第一位是十分位、第二位是百分位、第三位是千分位'+(D>=4?'、第四位是萬分位':'')+(D>=5?'、第五位是十萬分位':'')+'。',fn:()=>{for(let k=1;k<=D;k++)G.mark(-k,'第'+k,'tag')}});
  if(p!=null){const d=digAt(s,p);steps.push({t:p<0?`${PN[p]}是小數點後<b>${NTH[-p]}位</b>，這一格的數字是 <b>${d}</b>。`:`${PN[p]}的數字是 <b>${d}</b>。`,fn:()=>{G.hl(p)}})}
  if(e.p2!=null){const d2=digAt(s,e.p2);steps.push({t:`${PN[e.p2]}的數字是 <b>${d2}</b>。`,fn:()=>{G.hl(e.p2,'hl2')}})}
  expandSteps(s,pnl,steps);
};
// 位值倍數
EXB.times=(e,pnl,steps)=>{
  const a=e.a,b=e.b; // a 是大位值的數 ex 0.05, b 0.005
  const G=mkGrid([{s:a,lab:e.la||'左邊',pad:true},{s:b,lab:e.lb||'右邊',pad:true}],{});pnl.appendChild(G.el);G.el.classList.add('wide');
  steps.push({t:`${e.la||'左邊'}的 ${e.d} 是 <b>${a}</b>，${e.lb||'右邊'}的 ${e.d} 是 <b>${b}</b>。`,fn:()=>{G.showPads()}});
  steps.push({t:'定位板上每往左邊移一格，就是原來的 <b>10 倍</b>。',fn:()=>{G.hl(e.pa);G.hl(e.pb,'hl2')}});
  const m=vcModel(Array(10).fill(b),'+');
  exAdd(pnl,`<div class="exq">10 個 ${b} 加起來：</div>`,'wide');
  const G2=mkGrid([{s:b,lab:'×10個'}],{D:dp(b),sm:true,mark:false,line:true,res:true});G2.el.classList.add('wide');pnl.appendChild(G2.el);
  steps.push({t:`10 個 ${b} 合起來是 <b>${trimZ(m.res)}</b>，所以是 <b>10 倍</b>。`,fn:()=>{const r=trimZ(m.res);for(let p=intLen(r)-1;p>=-dp(b);p--){const d=digAt(padD(r,dp(b)),p);G2.setRes(p,d==null?'':String(d))}G2.resDot()}});
};
// 合起來（籌碼板＋直式）
function chipsBoard(cols){ // cols:[{p,c}]
  const box=document.createElement('div');box.className='chipsb wide';
  const api={el:box,set(p,c){const col=box.querySelector(`[data-p="${p}"]`);if(!col)return;const cc=col.querySelector('.cc');cc.innerHTML=Array.from({length:Math.min(c,10)},(_,i)=>`<b style="background:${PCOL[p]};animation-delay:${i*.05}s"></b>`).join('');col.querySelector('.cn').textContent=c?c+' 個':'';},hl(p){$$('.cbc',box).forEach(x=>x.classList.toggle('hl',x.getAttribute('data-p')==String(p)))}};
  box.innerHTML=cols.map(x=>`<div class="cbc" data-p="${x.p}"><div class="ch" style="background:${PCOL[x.p]}99">${PN[x.p]}</div><div class="cv">${unitOf(x.p)}</div><div class="cc"></div><div class="cn"></div></div>`).join('');
  return api;
}
EXB.compose=(e,pnl,steps)=>{
  const parts=e.parts.map(x=>({c:x[0],u:String(x[1]),p:x[1]>=1?Math.round(Math.log10(+x[1])):-dp(x[1])}));
  const res=addS.apply(null,parts.map(x=>mulC(x.c,x.u)).concat(['0']));
  const ps=uniq(parts.map(x=>x.p).concat(partsOf(res).map(x=>x.p))).sort((a,b)=>b-a);
  const B=chipsBoard(ps.map(p=>({p})));pnl.appendChild(B.el);
  const cnt={},bc={};ps.forEach(p=>{cnt[p]=0;bc[p]=0});
  parts.forEach(x=>{
    bc[x.p]+=x.c;
    steps.push({t:`${x.c} 個 ${x.u}，放在${PN[x.p]}。`,fn:()=>{cnt[x.p]+=x.c;B.set(x.p,cnt[x.p]);B.hl(x.p)}});
  });
  // 換一換（滿10個進一位）
  for(let k=0;k<6;k++){
    const p=ps.slice().reverse().find(pp=>bc[pp]>=10);if(p==null)break;
    const up=Math.floor(bc[p]/10);
    steps.push({t:`${PN[p]}有 ${bc[p]} 個。<b>每 10 個 ${unitOf(p)} 換成 1 個 ${unitOf(p+1)}</b>，可以換 ${up} 個，往左邊放。`,fn:(function(p,up){return ()=>{cnt[p]-=up*10;cnt[p+1]=(cnt[p+1]||0)+up;B.set(p,cnt[p]);B.set(p+1,cnt[p+1]);B.hl(p+1)}})(p,up)});
    bc[p]-=up*10;bc[p+1]=(bc[p+1]||0)+up;
  }
  steps.push({t:`每一格的個數，就是那一位的數字。合起來是 <b>${res}</b>。`,fn:()=>B.hl(null)});
  // 直式
  const vals=parts.map(x=>mulC(x.c,x.u)).filter(v=>cmpS(v,'0')>0);
  if(vals.length>=2){
    const m=vcModel(vals,'+');
    exAdd(pnl,'<span class="exlab">用直式加起來</span>','wide');
    const G=vcGrid(m,{labs:parts.filter(x=>x.c).map(x=>`${x.c}個${x.u}`),sm:true});G.el.classList.add('wide');pnl.appendChild(G.el);
    steps.push({t:`也可以用直式算：${vals.join(' ＋ ')}，小數點對齊。`,fn:()=>{G.showPads();G.hl('dot')}});
    steps.push({t:`一位一位加起來，等於 <b>${trimZ(m.res)}</b>。`,fn:()=>{G.clear();m.cols.forEach(c=>{G.setRes(c.p,String(c.w));if(c.cout)G.mark(c.p+1,'+'+c.cout)});G.resDot()}});
  }else{
    const G=mkGrid([{s:res,lab:'記下來'}],{sm:true});G.el.classList.add('wide');pnl.appendChild(G.el);G.el.style.opacity=.3;
    steps.push({t:`記在定位板上，就是 <b>${res}</b>。`,fn:()=>{G.el.style.opacity=1}});
  }
};
// 讀法
EXB.read=(e,pnl,steps)=>{
  const s=String(e.s),a=s.split('.');
  exAdd(pnl,'<span class="exlab">📋 先放進定位板</span>','wide');
  const G=mkGrid([{s}],{});G.el.classList.add('wide');pnl.appendChild(G.el);
  const box=exAdd(pnl,`<div class="rcards"><div class="rc grp"><b>${a[0]}</b><small></small></div><div class="rc dot"><b>.</b><small></small></div>${a[1].split('').map(c=>`<div class="rc"><b>${c}</b><small></small></div>`).join('')}</div>`,'wide');
  const rcs=$$('.rc',box);
  steps.push({t:`把 <b>${s}</b> 放進定位板：${partsSay(s)}。`,fn:()=>{for(let k=1;k<=a[1].length;k++)G.mark(-k,'第'+k,'tag')}});
  steps.push({t:`小數點<b>前面</b>的 ${a[0]}，像整數一樣唸：<b>${zhInt(+a[0])}</b>。`,fn:()=>{for(let p=0;p<a[0].length;p++)G.col(p).forEach(x=>x.classList.add('hl'));rcs[0].classList.add('on');rcs[0].querySelector('small').textContent=zhInt(+a[0])}});
  steps.push({t:'小數點唸作「<b>點</b>」。',fn:()=>{G.clear();G.hl('dot');rcs[1].querySelector('small').textContent='點'}});
  steps.push({t:`小數點<b>後面</b>，一個數字一個數字唸：${a[1].split('').map(c=>DG[+c]).join('、')}。`+(a[1].indexOf('0')>=0?'<b>0 也要唸出來</b>。':''),fn:()=>{G.clear();rcs.slice(2).forEach((r,i)=>{setTimeout(()=>{G.hl(-(i+1));r.classList.add('on');r.querySelector('small').textContent=DG[+a[1][i]]},i*600)})}});
  steps.push({t:`所以 ${s} 讀作「<b>${zhDec(s)}</b>」。`,say:`所以讀作，${zhDec(s)}。`,fn:()=>G.clear()});
  if(e.wrong)steps.push({t:`不是「${e.wrong}」喔！`+(e.why||'')});
};
// 0 能不能省略
EXB.zero=(e,pnl,steps)=>{
  e.list.forEach(s=>{
    s=String(s);
    const isInt=s.indexOf('.')<0,tz=!isInt&&/0$/.test(s),short=trimZ(s);
    const box=exAdd(pnl,`<div class="rcards">${s.split('').map((c,i)=>`<div class="rc${c==='.'?' dot':''}" data-i="${i}"><b>${c}</b><small></small></div>`).join('')}</div>`,'wide');
    const rcs=$$('.rc',box);
    let t;
    if(isInt){t=`${s} 是整數，後面的 0 <b>不能省略</b>（${s} 和 ${s.replace(/0+$/,'')||'0'} 不一樣）。`}

  const sh={};
  sh.ins=mk('instr');sh.ins.textContent=q.instr||'選出正確的答案';
  sh.stem=mk('stem');sh.stem.innerHTML=q.stemHtml||stemHtml(q.stem||'');
  if((q.stem||'').length>34)sh.stem.classList.add('long');
  sh.fig=mk('fig');figRender(q.fig,sh.fig);
  if(S.board&&q.pv){const G=mkGrid(q.pv.map(r=>({s:r.s,lab:r.lab||''})),{sm:true});$$('.c.n',G.el).forEach(c=>{if(/[□☆]/.test(c.textContent))c.classList.add('box')});sh.fig.classList.remove('none');const cap=document.createElement('div');cap.className='pvcap';cap.textContent='📋 定位板';sh.fig.appendChild(cap);sh.fig.appendChild(G.el);sh.pvG=G}

  sh.help=mk('btn helpb','button');sh.help.textContent=q.type==='vc'||q.type==='word'?'教我如何計算？':'教我怎麼做？';
  sh.help.onclick=()=>{if(ctx.done||!guard(300))return;TTS.stop();showExplain(ctx.exQ?ctx.exQ():q,{onClose:()=>{}})};
  return sh;
}

function vcFill(host,figEl,ctlEl,a,b,op,o){
  o=o||{};
  const m=vcModel([a,b],op);
  const G=vcGrid(m,{fill:true,padShow:true});figEl.innerHTML='';figEl.classList.remove('none');figEl.appendChild(G.el);
  m.nums.forEach((n,i)=>{if(dp(n)<m.D)G.lab(i,'<span style="color:#ff8c42">補0→</span>')});
  const tip=document.createElement('div');tip.className='vtip';figEl.appendChild(tip);
  const seq=[];for(let p=-m.D;p<m.rl;p++)seq.push(p);
  seq.forEach(p=>{const c=G.cell('x',p);c.classList.add('an')});
  const pad=document.createElement('div');pad.className='pad';ctlEl.innerHTML='';ctlEl.appendChild(pad);
  pad.innerHTML=[1,2,3,4,5,6,7,8,9,0].map(d=>`<button class="k" data-d="${d}">${d}</button>`).join('');
  let k=0,cellMiss=0,errs=0,auto=false,done=false;
  const colOf=p=>m.cols.find(c=>c.p===p);
  const act=(speak)=>{
    $$('.an.cur',G.el).forEach(x=>x.classList.remove('cur'));
    if(k>=seq.length)return fin();
    const p=seq[k],c=colOf(p),cell=G.cell('x',p);cell.classList.add('cur');G.hl(p);cellMiss=0;
    G.lab('x','答案');
    if(op==='-'&&c.borrow&&!c._shown){c._shown=1;G.lab('m','<span style="color:#e03131">借位</span>');c.borrow.chain.forEach(x=>{const e=G.cell(0,x.p);e&&e.classList.add('x');G.mark(x.p,String(x.v))})}
    tip.innerHTML=colAsk(m,c);
    if(speak!==false&&S.voice)say(stripB(colAsk(m,c)).replace('＝ ？','等於多少？'));
  };
  const fill=(d,cls)=>{const p=seq[k],c=colOf(p),cell=G.cell('x',p);cell.textContent=d;cell.classList.remove('cur');cell.classList.add(cls);
    if(op==='+'&&c.cout){G.lab('m','<span style="color:#e03131">進位</span>');G.mark(p+1,'+'+c.cout)}k++;};
  const fin=()=>{if(done)return;done=true;G.clear();G.resDot();
    const unit=o.unit||'';let t=`答案是 <b>${m.res}${unit}</b>`;if(m.res!==m.resShort)t+=`，最後的 0 可以省略，寫成 <b>${m.resShort}${unit}</b>`;
    tip.innerHTML=t+'。';pad.style.visibility='hidden';
    o.onDone&&o.onDone({first:errs===0,auto,m,tip:t});
  };
  pad.onclick=e=>{
    const b=e.target.closest('.k');if(!b||done)return;if(!guard(140))return;
    const d=+b.getAttribute('data-d'),p=seq[k],want=digAt(m.res,p);
    if(d===want){SFX.key();TTS.stop();fill(String(d),'okc');later(()=>act(),250)}
    else{errs++;cellMiss++;SFX.bad();const cell=G.cell('x',p);cell.classList.remove('bad');void cell.offsetWidth;cell.classList.add('bad');
      o.onErr&&o.onErr();
      if(cellMiss>=2){auto=true;tip.innerHTML=colTip(m,colOf(p));say(stripB(colTip(m,colOf(p))));fill(String(want),'rev');pad.style.pointerEvents='none';later(()=>{pad.style.pointerEvents='';act(false)},2600)}
      else{say('再算一次。'+stripB(colAsk(m,colOf(p))).replace('＝ ？','等於多少？'))}
    }
  };
  return {m,G,start:()=>act(false),speakCur:()=>{if(k<seq.length)say(stripB(colAsk(m,colOf(seq[k]))).replace('＝ ？','等於多少？'))}};
}

R.word=(q,host,ctx)=>{
  const sh=shell(q,host,ctx);
  const base=q.fig;
  let si=0;let nn=0;q.steps.forEach((s,i)=>{if(s.kind==='calc')s.no=nn;else{nn++;s.no=nn}});const total=nn;
  const stepEl=document.createElement('div');stepEl.className='stepn';
  const runStep=()=>{
    const st=q.steps[si];sh.ctl.innerHTML='';setFb(sh,'');ctx.tries=0;
    const lab=total>1?`第 ${st.no} 步（共 ${total} 步）`+(st.note?'：':''):'';
    if(st.kind==='pick'){
      figRender(base,sh.fig);
      if(st.note||lab){stepEl.textContent=lab+(st.note||'')||'選一個算式';sh.fig.insertBefore(stepEl,sh.fig.firstChild)}
      sh.ins.textContent=st.instr||'要怎麼算？選一個算式';
      const opts=st.opts;const g=optGrid(opts);const box=document.createElement('div');box.className=g.cls;sh.ctl.appendChild(box);
      const bs=opts.map((o,i)=>{const b=document.createElement('button');b.className='opt c'+(i%4)+(g.long?' long':'');b.innerHTML=`<span class="nb">${i+1}</span>${esc(o.t)}`;box.appendChild(b);
        b.onclick=()=>{if(ctx.done||st._lock||!guard(250))return;TTS.stop();bs.forEach(x=>x.classList.remove('hot'));
          if(i===st.ans){st._lock=1;bs.forEach(x=>{if(x!==b)x.classList.add('off')});b.classList.add('ok');SFX.step();setFb(sh,'👍 '+esc(o.t),'ok');later(nextStep,900)}
          else{b.classList.add('no');setTimeout(()=>b.classList.add('off'),400);ctx.first=false;ctx.tries++;
            if(ctx.tries>=2){st._lock=1;bs[st.ans].classList.add('ok');setFb(sh,'要用：'+esc(opts[st.ans].t),'ok');SFX.bad();
              showExplain({ex:st.ex||q.ex},{qtext:q.stem,intro:'一起看看要怎麼想。',closeTxt:'我懂了，繼續',onClose:()=>later(nextStep,300)})}
            else{SFX.bad();const h=st.hint||'再讀一次題目，想一想。';setFb(sh,h,'bad');say(h)}}};return b});
      ctx.optSay=opts.map((o,i)=>({t:`第${i+1}個，${o.say||o.t}`,on:()=>{bs.forEach(x=>x.classList.remove('hot'));bs[i].classList.add('hot')}}));
      ctx.optEnd=()=>bs.forEach(x=>x.classList.remove('hot'));
      speakSeq([(si===0?'':(st.note||'下一步。'))+(st.say||st.instr||'要怎麼算？選一個算式。')].concat(ctx.optSay).concat([{t:'',on:ctx.optEnd}]));
    }else{ // calc
      sh.ins.textContent='用直式算算看，從最右邊開始填';
      stepEl.textContent=(total>1?`第 ${st.no} 步：`:'')+`${st.a} ${st.op==='+'?'＋':'－'} ${st.b} ＝ ？`;
      const F=vcFill(host,sh.fig,sh.ctl,st.a,st.b,st.op,{unit:st.last?q.unit:(st.unit||''),onErr:()=>{ctx.first=false},onDone:r=>{
        sh.fig.insertBefore(stepEl,sh.fig.firstChild);
        if(r.auto){ctx.first=false;later(()=>showExplain({ex:{kind:'vc',nums:[st.a,st.b],op:st.op,unit:st.last?q.unit:''}},{qtext:q.stem,intro:'再一起看一次怎麼算。',closeTxt:'我懂了，繼續',onClose:()=>later(nextStep,300)}),1500)}
        else later(nextStep,1300);
      }});
      sh.fig.insertBefore(stepEl,sh.fig.firstChild);
      ctx.optSay=[];ctx.replayExtra=()=>F.speakCur();
      F.start();
      say((st.note?st.note+'。':'')+`用直式算 ${st.a} ${st.op==='+'?'加':'減'} ${st.b}。從最右邊的${PN[-Math.max(dp(st.a),dp(st.b))]||'個位'}開始。`);
    }
  };
  const nextStep=()=>{si++;if(si<total)return runStep();
    ctx.done=false;const ans=q.ansText||`${q.ans}${q.unit||''}`;setFb(sh,'✅ 答：'+esc(ans),'ok');ctx.right(sh,'答案是 '+ans)};
  ctx.firstSpeak=()=>{};ctx.custom=true;
  // 先唸題目，再開始第一步
  ctx.sayQ=()=>{const st=q.steps[si];speakSeq([q.say||q.stem].concat(st&&st.kind==='pick'?[st.say||st.instr||'要怎麼算？選一個算式。'].concat(ctx.optSay||[]).concat([{t:'',on:ctx.optEnd||(()=>{})}]):[]))};
  runStep();
  TTS.stop();

const QM={qs:[],i:0,res:[],cfg:null,gen:0,ctx:null};
function qmStart(qs,cfg){QM.qs=qs;QM.i=0;QM.res=[];QM.cfg=cfg;QM.gen++;qmShow()}
function qmProg(){const el=QM.cfg.prog;if(!el)return;el.innerHTML=QM.qs.map((q,i)=>`<i class="${i<QM.i?(QM.res[i]?'ok':'bad'):i===QM.i?'cur':''}"></i>`).join('')}
function mkCtx(q,gen){
  const ctx={q,tries:0,first:true,done:false,optSay:[],
    right(sh,sayTxt){if(ctx.done)return;ctx.done=true;cheer();QM.cfg.onAnswer&&QM.cfg.onAnswer(ctx.first,q,true);
      if(sh){if(!sayTxt)setFb(sh,ctx.first?'✅ 答對了！':'✅ 對了！','ok');else setFb(sh,'✅ '+esc(sayTxt),'ok')}
      const t=sayTxt?TTS.est(sayTxt)+500:1300;if(sayTxt)say(sayTxt);
      later(()=>gen===QM.gen&&ctx.finish(ctx.first),Math.max(1300,Math.min(t,3200)))},
    miss(sh,hint){if(ctx.done)return;ctx.tries++;ctx.first=false;
      if(ctx.tries<2){SFX.bad();const h=hint||'再想一想。';setFb(sh,h,'bad');say(h)}
      else{ctx.done=true;SFX.bad();ctx.reveal&&ctx.reveal();QM.cfg.onAnswer&&QM.cfg.onAnswer(false,q,false);
        later(()=>{if(gen!==QM.gen)return;showExplain(q,{intro:'沒關係，我們一起看看怎麼做。',closeTxt:'我懂了，下一題',onClose:()=>ctx.finish(false,true)})},1100)}},
    finish(first,counted){if(gen!==QM.gen||ctx._fin)return;ctx._fin=true;if(!counted&&!first&&!ctx._counted){}QM.res[QM.i]=first;QM.i++;qmShow()},
    sayQ(){const items=[];const lead=(!S.seen[q.type+(q.instr||'')]&&q.instr)?q.instr+'。':'';S.seen[q.type+(q.instr||'')]=1;
      items.push((lead?lead:'')+(q.say||q.stem));(ctx.optSay||[]).forEach(x=>items.push(x));items.push({t:'',on:ctx.optEnd||(()=>{})});speakSeq(items)}
  };
  return ctx;
}
function qmShow(){
  const gen=QM.gen;
  if(QM.i>=QM.qs.length){QM.cfg.onEnd(QM.res);return}
  const q=QM.qs[QM.i];qmProg();
  QM.cfg.onQ&&QM.cfg.onQ(q,QM.i);
  const ctx=mkCtx(q,gen);QM.ctx=ctx;
  const host=QM.cfg.host;
  try{R[q.type](q,host,ctx)}catch(e){console.error(e,q);(window.__qerr=window.__qerr||[]).push(String(e&&e.stack||e));QM.i++;return later(qmShow,10)}
  if(!ctx.custom)ctx.sayQ();
  fitCheck();
}
function qmReplay(){const c=QM.ctx;if(!c||c.done)return;c.sayQ()}

function MC(stem,correct,wrongs,o){o=o||{};correct=String(correct);let w=uniq(wrongs.map(String)).filter(x=>x!==correct);w=shuffle(w).slice(0,(o.n||4)-1);if(!w.length)throw new Error('no wrongs: '+stem);
  const all=o.keep?[correct].concat(w):shuffle([correct].concat(w));if(o.keep)all.sort((x,y)=>o.keep.indexOf(x)-o.keep.indexOf(y));

function decWrongs(s,n){ // 常見錯誤的小數
  s=String(s);const out=new Set();const a=s.split('.'),ip=a[0],fp=a[1]||'';
  if(fp){
    if(fp.indexOf('0')>=0)out.add(trimZ(ip+'.'+fp.replace('0','')));
    out.add(ip+'.0'+fp);
    if(fp.length>1){const i=rnd(0,fp.length-2);const f=fp.split('');const t=f[i];f[i]=f[i+1];f[i+1]=t;out.add(trimZ(ip+'.'+f.join('')))}

    if(+ip>=1||fp.length>1)out.add(trimZ(fromI(Math.round(toI(s,dp(s))/10),dp(s))));
    out.add(trimZ(ip+'.'+fp.slice(0,-1)+'0'+fp.slice(-1)));

function readWrongs(s){
  s=String(s);const a=s.split('.'),ip=a[0],fp=a[1];const out=new Set();const I=zhInt(+ip);
  if(fp.indexOf('0')>=0)out.add(I+'點'+fp.replace('0','').split('').map(c=>DG[+c]).join(''));
  const m=fp.match(/^(0*)(\d+)$/);if(m&&m[2].length>=2&&m[2].length<=3)out.add(I+'點'+m[1].split('').map(()=>'零').join('')+zhInt(+m[2]));
  if(ip.length>=2)out.add(ip.split('').map(c=>DG[+c]).join('')+'點'+fp.split('').map(c=>DG[+c]).join(''));
  out.add(I+'點零'+fp.split('').map(c=>DG[+c]).join(''));
  const zs=fp.replace(/0/g,'');if(zs!==fp)out.add(I+'點'+zs.split('').map(c=>DG[+c]).join(''));
  out.delete(zhDec(s));return Array.from(out);
}

  if(type==='diff')return {rows:[{name:n[0],segs:[{v:a,t:a}]},{name:n[1],segs:[{v:b,t:b,c:'b'},{v:r,t:'差 ？',c:'q'}]}],t:`比比看相差多少，大的減小的，用<b>減法</b>。`};

  const res=op==='+'?addS(rs[0],rs[1]):subS(rs[0],rs[1]);calcSteps(rs[0],rs[1],op,barFor(op==='+'?'join':'diff',rs[0],rs[1],op,['','','']),'用概數來算',true).forEach(x=>steps.push(x));

  {id:3,ic:'🗣️',name:'回音山谷',sub:'小數怎麼唸、怎麼寫',story:'對著山谷大聲唸，回音會告訴你對不對。',mk:[[1,()=>readQ()],[2,()=>readQ()],[2,writeQ],[3,()=>pick(L3F)()]],prize:'📯'},

  {id:5,ic:'🚶',name:'步道排排隊',sub:'從小到大排一排',story:'登山客要排隊過吊橋，幫大家排好順序。',mk:[[1,()=>ordQ(pick(ORD.slice(0,4)))],[1,genOrd],[2,()=>ordQ(pick(ORD.slice(4)))],[3,()=>pick(L5F)()],[3,()=>ordQ(pick(ORD.slice(4)))]],prize:'🌉'},
  {id:6,ic:'🔢',name:'密碼山屋',sub:'□ 裡可以填幾',story:'山屋的門有密碼鎖，找出可以填的數字。',mk:[[1,()=>boxQ(pick(BOXF.slice(0,6)))],[2,genBox],[2,()=>boxQ(pick(BOXF.slice(6)))],[3,()=>pick(L6F)()],[3,genBox]],prize:'🔑'},

  {id:8,ic:'➖',name:'減法瀑布',sub:'直式減法，不夠減要借',story:'瀑布邊的石頭要用減法才踩得過去。',mk:[[1,()=>poolQ(SUBP,'-',1)],[1,()=>genSub(1)],[2,()=>poolQ(SUBP,'-',2)],[2,()=>genSub(2)],[3,()=>poolQ(SUBP,'-',3)],[3,()=>pick(L8F)()]],prize:'💦'},
  {id:9,ic:'🎯',name:'雲海觀景台',sub:'四捨五入取概數',story:'雲霧來了！用四捨五入看清楚大約是多少。',mk:[[1,()=>{const c=pick(RND1);return roundQ(c[0],c[1])}],[1,()=>genRound(1)],[2,()=>{const c=pick(RND2);return roundQ(c[0],c[1])}],[2,()=>genRound(2)],[3,()=>pick(L9F)()]],prize:'☁️'},
  {id:10,ic:'🥾',name:'主峰應用題',sub:'讀題目、選算式、直式算',story:'快到山頂了！讀懂題目，選對算式再計算。',mk:[[1,()=>pick(WORDS.slice(0,8))()],[2,()=>pick(WORDS.slice(8))()],[2,()=>pick(WORDSX.concat(WORDSR.slice(3)))()],[3,()=>pick(WORDS2.slice(0,3).concat(WORDSR.slice(0,3)))()]],prize:'🏔️'},
  {id:11,ic:'☃️',name:'山頂雪怪大挑戰',sub:'綜合題，打敗雪怪',story:'山頂的雪怪出題目了！答對就能打敗牠。',boss:true,prize:'🏆'}
];
function qKey(q){return q.type+'|'+q.stem+'|'+(q.a||'')+(q.b||'')+(q.items||[]).join(',')+(q.opts||[]).map(o=>o.t).join(',')+(q.fig&&q.fig.s||'')}
function tryMake(fn,seen){for(let t=0;t<16;t++){try{const q=fn();if(!q)continue;const k=qKey(q);if(seen&&seen.has(k))continue;seen&&seen.add(k);return q}catch(e){(window.__qerr=window.__qerr||[]).push(String(e&&e.stack||e))}}return null}
const SEEN=new Set();
function buildQs(lv,n){
  const tiers=[1,2,3].map(t=>lv.mk.filter(x=>x[0]===t).map(x=>x[1]));
  const a=Math.max(1,Math.round(n/3)),b=Math.max(1,Math.round(n/3)),cnt=[a,b,Math.max(1,n-a-b)];const out=[];
  cnt.forEach((c,ti)=>{for(let i=0;i<c;i++){const pool=tiers[ti].length?tiers[ti]:tiers[1];const q=tryMake(pick(pool),SEEN)||tryMake(pick(pool),null);if(q){q.tier=ti+1;q.lv=lv.id;out.push(q)}}});
  return out;
}
function buildBoss(n){
  const out=[];const ls=shuffle(LV.filter(l=>!l.boss)).slice(0,n-3);
  ls.forEach(l=>{const pool=l.mk.filter(x=>x[0]>=2).map(x=>x[1]);const q=tryMake(pick(pool),SEEN);if(q){q.lv=l.id;out.push(q)}});
  shuffle(BOSSF).slice(0,3).forEach(f=>{const q=tryMake(f,null);if(q)out.push(q)});
  return shuffle(out);
}

<script>

function avatar(){return CHARS[S.prof.c][0]}
function syncChips(){const h=`<span class="av">${avatar()}</span><span class="nmx">${esc(S.prof.n||CHARS[S.prof.c][1])}</span><span class="pt">🏅${S.pts}</span>`;['#homeChip','#lvChip'].forEach(s=>{const e=$(s);if(e)e.innerHTML=h})}

    closeOv();go('home');if(start)say('點一個登山站，就可以開始爬山。每一站都可以直接玩。');

/* ================= 首頁：登山地圖 ================= */
function isLand(){return window.matchMedia('(min-aspect-ratio: 13/10)').matches}
function nextStation(){for(let i=1;i<=11;i++)if(!S.done[i])return i;return 0}

/* ================= 闖關 ================= */
function levelScreen(){$('#teams').classList.add('hide');$('#teams').innerHTML='';go('level')}
function introCard(ic,title,sub,then,sayTxt){

const PRAISE3=['一路順暢，登山高手！','腳步好穩，一題都難不倒你！','山上的動物都在幫你拍手！','又快又準，像水鹿一樣！'];
const PRAISE2=['爬過這一站了，再玩一次會更熟。','很不錯，繼續往上爬！','做得很好，多練習會更快。'];
const PRAISE1=['還是爬上來了！慢慢來，下次會更好。','有些路比較陡，再玩一次試試看。','休息一下，再爬一次會更順。'];
const USED={};function fresh(k,l){const u=USED[k]=USED[k]||[];let c=l.filter(x=>u.indexOf(x)<0);if(!c.length){USED[k]=[];c=l}const v=pick(c);USED[k].push(v);return v}
function startFloor(id){
  stopAll();const lv=LV[id-1];RUN={kind:'level',lv,combo:0,got:0};
  levelScreen();
  if(lv.boss)return startBoss();
  introCard(lv.ic,`第 ${lv.id} 站　${lv.name}`,lv.story,()=>{
    if(lv.demo&&!S.demoSeen[lv.id]){S.demoSeen[lv.id]=1;return lessonDecimal($('#qwrap'),()=>startQs(lv),true)}
    startQs(lv);
  },`第${lv.id}站，${lv.name}。${lv.story}`);
}
function onAns(first,q,got){
  if(!RUN)return;
  if(got){addPts(first?10:5);RUN.got++;if(first){RUN.combo++;if(RUN.combo>=3&&RUN.combo%3===0)later(()=>{toast(`🔥 連續答對 ${RUN.combo} 題！`);SFX.clap();addPts(5)},700)}else RUN.combo=0}else RUN.combo=0;
}
function startQs(lv){
  const tok=RUNTOK;const qs=buildQs(lv,S.count);
  qmStart(qs,{host:$('#qwrap'),prog:$('#prog'),onAnswer:onAns,onEnd:res=>{if(tok===RUNTOK)endFloor(lv,res)}});
}
function calcStars(res){const n=res.length,c=res.filter(Boolean).length;return c>=n-1?3:c>=Math.ceil(n/2)?2:1}
function endFloor(lv,res){
  const stars=calcStars(res);S.done[lv.id]=true;S.stars[lv.id]=Math.max(S.stars[lv.id]||0,stars);
  SFX.fanfare();confetti(30,['⭐','🌸','🍃','✨',lv.prize]);
  const praise=fresh('p'+stars,stars===3?PRAISE3:stars===2?PRAISE2:PRAISE1);
  const next=lv.id<11?lv.id+1:0;
  showResult({emoji:lv.prize,title:`第 ${lv.id} 站 過關！`,sub:praise,stars,extra:`<div class="prize">拿到紀念章<span>${lv.prize}</span></div><div class="sub">這次拿到 🏅 ${S.sessPts} 點</div>`,
    say:`第${lv.id}站過關！${praise}`,
    btns:[next?{t:next===11?'挑戰山頂雪怪':'下一站',cls:'g big',fn:()=>startFloor(next)}:null,{t:'再玩一次',cls:'y',fn:()=>startFloor(lv.id)},{t:'回地圖',cls:'',fn:()=>{stopAll();go('home')}}].filter(Boolean)});
}
function showResult(o){
  S.sessPts=0;
  go('result');
  $('#rbody').innerHTML=`<div class="bigic">${o.emoji}</div><div class="ttl">${o.title}</div>${o.stars!=null?`<div class="rstars">${[0,1,2].map(i=>`<span class="${i<o.stars?'on':''}" style="animation-delay:${.3+i*.25}s">★</span>`).join('')}</div>`:''}<div class="rsub">${o.sub||''}</div>${o.extra||''}`;

/* ================= 認識多位小數（自動播放的小課）================= */
function lessonDecimal(host,onDone,inLevel){
  RUNTOK++;const tok=RUNTOK;host.classList.remove('land');
  const PS=[0,-1,-2,-3,-4,-5];
  const pvh=`<div class="lpv" id="lsPv">${PS.map(p=>(p===-1?'<div class="lc dot"><span></span><em>.</em></div>':'')+`<div class="lc" data-p="${p}"><span style="background:${PCOL[p]}99">${PH[p]}位</span><em></em></div>`).join('')}</div>`;
  host.innerHTML=`<div class="les-scene" id="lsScene"></div><div class="les-stage" id="lsStage"></div>${pvh}<div class="les-say" id="lsSay"></div><div class="seg" style="width:100%">${inLevel?'<button class="btn" id="lsSkip">跳過</button>':'<button class="btn y" id="lsAgain">從頭看</button>'}<button class="btn" id="lsPause">暫停</button><button class="btn b" id="lsNext">下一步</button></div>`;
  const st=$('#lsStage'),sy=$('#lsSay'),pv=$('#lsPv'),scn=$('#lsScene');
  // 定位板：寫數字（不是寫位值）
  const board=(s,hl)=>{pv.style.display='';const D=dp(s);$$('.lc[data-p]',pv).forEach(c=>{const p=+c.getAttribute('data-p');let d=digAt(s,p);if(d==null&&p<0&&p>=-D)d=0;c.querySelector('em').textContent=d==null?'':d;c.classList.toggle('off',d==null);c.classList.toggle('cur',hl!=null&&(Array.isArray(hl)?hl.indexOf(p)>=0:p===hl))});$('.lc.dot em',pv).textContent=D?'.':''};
  const UN=['1','0.1','0.01','0.001','0.0001','0.00001'];
  const L=isLand();
  // 畫一條數線。o:{p, cuts, nums, fill, unit, run, ctx}
  const draw=o=>{
    const p=o.p,W=L?640:330,m=24,y=o.ctx?(L?120:128):(L?70:80),H=y+(L?60:66);
    const cw=(W-2*m)/10,base=PCOL[-(p-1)],part=PCOL[-p];
    let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${L?'calc(var(--u)*62)':'calc(var(--u)*32)'};height:auto;max-height:100%">`;
    if(o.ctx){ // 上方的小數線：從哪裡放大來的
      const y0=24,cm=W*0.3,cwid=W*0.4,c10=cwid/10;
      s+=`<line x1="${cm}" y1="${y0}" x2="${cm+cwid}" y2="${y0}" stroke="#1d2b3a" stroke-width="2"/>`;
      for(let k=0;k<=10;k++)s+=`<line x1="${cm+k*c10}" y1="${y0-5}" x2="${cm+k*c10}" y2="${y0+5}" stroke="#1d2b3a" stroke-width="1"/>`;
      s+=`<rect x="${cm}" y="${y0-6}" width="${c10}" height="12" fill="${base}" stroke="#1d2b3a"/><text x="${cm-4}" y="${y0+4}" text-anchor="end" font-size="12" font-weight="800">0</text><text x="${cm+cwid+4}" y="${y0+4}" font-size="12" font-weight="800">${UN[p-2]}</text>`;
      s+=`<line x1="${cm}" y1="${y0+7}" x2="${m}" y2="${y-13}" stroke="#1d2b3a" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="${cm+c10}" y1="${y0+7}" x2="${W-m}" y2="${y-13}" stroke="#1d2b3a" stroke-width="1.2" stroke-dasharray="4 3"/><polygon points="${cm},${y0+7} ${cm+c10},${y0+7} ${W-m},${y-13} ${m},${y-13}" fill="${base}" opacity=".15"/><text x="${W/2}" y="${(y0+y)/2+6}" text-anchor="middle" font-size="15" font-weight="900" fill="#2f6b4f">🔍 把 ${UN[p-1]} 放大</text>`;
    }
    s+=`<rect x="${m}" y="${y-11}" width="${W-2*m}" height="22" rx="4" fill="${base}" opacity=".55"/>`;
    for(let k=0;k<(o.fill||0);k++)s+=`<rect x="${m+k*cw+1}" y="${y-11}" width="${cw-2}" height="22" rx="3" fill="${part}" stroke="#1d2b3a" stroke-width="1.3" style="animation:popin .35s both"/>`;
    s+=`<line x1="${m}" y1="${y}" x2="${W-m}" y2="${y}" stroke="#1d2b3a" stroke-width="2.6"/>`;
    s+=`<line x1="${m}" y1="${y-16}" x2="${m}" y2="${y+16}" stroke="#1d2b3a" stroke-width="3"/><line x1="${W-m}" y1="${y-16}" x2="${W-m}" y2="${y+16}" stroke="#1d2b3a" stroke-width="3"/>`;
    for(let k=1;k<=(o.cuts||0);k++)s+=`<line x1="${m+k*cw}" y1="${y-14}" x2="${m+k*cw}" y2="${y+14}" stroke="#c2410c" stroke-width="2.2" style="animation:popin .3s both"/>`;
    for(let k=1;k<=(o.nums||0);k++)s+=`<text x="${m+(k-.5)*cw}" y="${y+5}" text-anchor="middle" font-size="${L?15:13}" font-weight="900" fill="#1d2b3a" style="animation:popin .3s both">${k}</text>`;
    s+=`<text x="${m}" y="${y+36}" text-anchor="middle" font-size="16" font-weight="900">0</text><text x="${W-m}" y="${y+36}" text-anchor="middle" font-size="16" font-weight="900">${UN[p-1]}</text>`;
    if(o.unit)s+=`<text x="${m+cw/2}" y="${y-20}" text-anchor="middle" font-size="16" font-weight="900" fill="#c2410c">${UN[p]}</text><text x="${m+cw/2}" y="${y+52}" text-anchor="middle" font-size="12" font-weight="900" fill="#c2410c">1份</text>`;
    if(o.run){const x=Math.min(m+o.fill*cw,W-m);const full=o.fill>=10;s+=`<text x="${full?W/2:x}" y="${y-20}" text-anchor="middle" font-size="17" font-weight="900" fill="#c2410c">${full?'10 份 ＝ '+o.run:o.run}</text>`+(full?'':`<text x="${x}" y="${y+36}" text-anchor="middle" font-size="12" font-weight="900" fill="#566573">${o.fill}份</text>`)}
    return s+'</svg>';
  };
  const setScene=t=>{scn.innerHTML=t};
  let D={};const R=o=>{D=Object.assign(D,o);st.innerHTML=draw(D)};
  // 動畫：每隔 ms 執行一次 fn(k)，k=1..n，結束呼叫 done
  const anim=(n,ms,fn,done,g)=>{let k=0;const tick=()=>{if(g!==G.gen)return;if(G.paused){G.resume=tick;return}k++;fn(k);if(k<n)later(tick,ms);else done&&done()};later(tick,ms)};
  const G={gen:0,i:0,paused:false,resume:null};
  const steps=[];
  // ---- 一個位一個畫面 ----
  const NM=['','十分','百分','千分','萬分','十萬分'];
  const scene=(p)=>{
    const u=UN[p],w=UN[p-1],up=-(p-1),pp=-p;
    const sc=`畫面 ${p}：認識 ${u}`;
    if(p===1){
      steps.push({sc,t:'這一整條代表 <b>1</b>，就像一整條巧克力。定位板的<b>個位</b>寫 1。',fn:()=>{D={p:1};R({});board('1',0)}});
    }else{
      steps.push({sc,t:`把 <b>${w}</b> 這一小份拿出來，用放大鏡放大，變成這一整條。這一整條是 <b>${w}</b>。`,fn:()=>{D={p,ctx:1};R({});board(w,up)}});
    }
    steps.push({sc,t:`把它<b>平分成 10 份</b>，每一份一樣長。我們來切一切，再數一數。`,fn:(g,done)=>{anim(9,330,k=>{R({cuts:k});SFX.tap()},()=>anim(10,380,k=>{R({nums:k});SFX.key()},done,g),g)}});
    steps.push({sc,t:`拿出其中 <b>1 份</b>。它是 10 份裡的 1 份，叫做<b>${NM[p]}之一</b>，寫成 <b>${u}</b>。`,fn:()=>{R({nums:0,fill:1,unit:1});board(u,pp)}});
    steps.push({sc,t:`${u} 的 <b>1</b>，寫在小數點後<b>第${'一二三四五'[p-1]}位</b>，就是<b>${NM[p]}位</b>，表示有 1 個 ${u}。`+(p>1?`前面的位沒有東西，要寫 <b>0</b>。`:''),fn:()=>{board(u,pp)}});
    if(p<=3){
      steps.push({sc,t:`一份一份數：1 個 ${u}、2 個 ${u}、3 個 ${u}……看定位板，<b>${NM[p]}位的數字</b>就是有幾份。`,fn:(g,done)=>{R({unit:0});anim(9,750,k=>{const v=fromI(k,p,true);R({fill:k,run:v});board(v,pp);SFX.step()},done,g)}});
      steps.push({sc,t:`<b>10 個 ${u}</b> 合起來，就是一整條，也就是 <b>${w}</b>。`,fn:()=>{R({fill:10,run:w});board(w,up)}});
    }
  };
  [1,2,3,4,5].forEach(scene);
  // 整理：1 往右走
  steps.push({sc:'整理：1 往右走',t:'看這個定位板：<b>1 每往右邊走一格</b>，就變成原來的<b>十分之一</b>。',fn:()=>{pv.style.display='none';const G2=mkGrid(UN.map(s=>({s,pad:true,padShow:true})),{D:5,I:1,mark:false});st.innerHTML='';st.appendChild(G2.el);UN.forEach((s,i)=>{const c=G2.cell(i,-i);c&&c.classList.add('hl')})}});
  steps.push({sc:'整理：1 往右走',t:'1、0.1、0.01、0.001、0.0001、0.00001，<b>1 分別住在個位、十分位、百分位、千分位、萬分位、十萬分位</b>。'});
  steps.push({sc:'試一試',t:'1 個 1、3 個 0.1、2 個 0.01 和 6 個 0.001，放進定位板，就是 <b>1.326</b>，讀作一點三二六。',fn:()=>{st.innerHTML=`<div class="big1" style="font-size:calc(var(--u)*3)">1.326</div>`;board('1.326',[0,-1,-2,-3])}});
  TTS.mult=0.85;
  const go2=()=>{
    if(tok!==RUNTOK)return;G.gen++;const g=G.gen;
    if(G.i>=steps.length){TTS.mult=1;$('#lsNext').disabled=true;if(inLevel){sy.innerHTML='準備好了，開始闖關！';say('準備好了，開始闖關！',()=>later(()=>tok===RUNTOK&&onDone(),300))}return}
    const s=steps[G.i++];setScene(s.sc);sy.innerHTML=s.t;
    let a=!s.fn||s.fn.length<2,b=false;const nxt=()=>{if(a&&b&&g===G.gen&&!G.paused)later(()=>{if(g===G.gen&&!G.paused)go2()},S.voice&&TTS.ok?1600:readWait(stripB(s.t)))};
    try{s.fn&&s.fn(g,()=>{a=true;nxt()})}catch(e){console.error(e);a=true}
    speakSeq([stripB(s.t)],()=>{b=true;nxt()},400);
  };
  $('#lsPause').onclick=()=>{if(!guard(300))return;G.paused=!G.paused;$('#lsPause').textContent=G.paused?'繼續':'暫停';if(G.paused)TTS.stop();else{if(G.resume){const r=G.resume;G.resume=null;r()}else go2()}};
  $('#lsNext').onclick=()=>{if(!guard(300))return;TTS.stop();G.paused=false;G.resume=null;$('#lsPause').textContent='暫停';go2()};
  const sk=$('#lsSkip');if(sk)sk.onclick=()=>{if(!guard(300))return;RUNTOK++;TTS.stop();TTS.mult=1;clearLater();onDone()};
  const ag=$('#lsAgain');if(ag)ag.onclick=()=>{if(!guard(300))return;clearLater();lessonDecimal(host,onDone,inLevel)};
  go2();
}

document.documentElement.classList.add('gen'+GEN);
const BOX='.les-stage,.clsfig,#lsStage,.les-scene'+(GEN==='C'?',.exbody>.exfig':'');
function measure(kids){let t=1e9,b=-1e9,l=1e9,r=-1e9;kids.forEach(k=>{const R=k.getBoundingClientRect();if(!R.width&&!R.height)return;t=Math.min(t,R.top);b=Math.max(b,R.bottom);l=Math.min(l,R.left);r=Math.max(r,R.right)});return b<t?[0,0]:[b-t,r-l]}
function fitBox(c){
  if(!c.offsetParent)return;
  const kids=[...c.children].filter(k=>{const p=getComputedStyle(k).position;return p!=='absolute'&&p!=='fixed'});
  if(!kids.length)return;
  kids.forEach(k=>{if(k.style.zoom)k.style.zoom=''});
  const cs=getComputedStyle(c),aH=c.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-4,aW=c.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-4;
  if(aH<20||aW<20)return;
  let [h,w]=measure(kids);if(!h||(h<=aH+1&&w<=aW+1))return;
  let z=Math.max(.4,Math.min(1,aH/h,aW/w));
  for(let i=0;i<5;i++){kids.forEach(k=>k.style.zoom=z.toFixed(3));[h,w]=measure(kids);if((h<=aH+1&&w<=aW+1)||z<=.4)break;z=Math.max(.4,z*Math.min(.95,aH/h,aW/w))}
}
function fitScroll(c){ // 解說視窗：圖太大時，把圖縮小，讓字也看得到
  if(!c.offsetParent)return;
  const f=c.querySelector(':scope>.exfig');if(!f)return;
  if(f.style.zoom)f.style.zoom='';
  if(c.scrollHeight<=c.clientHeight+2)return;
  let z=1;
  for(let i=0;i<6;i++){z=Math.max(.5,z*Math.min(.93,c.clientHeight/c.scrollHeight));f.style.zoom=z.toFixed(3);if(c.scrollHeight<=c.clientHeight+2||z<=.5)break}
}
let fitQ=0;
function fitAll(){fitQ=0;try{qa(BOX).forEach(fitBox);if(GEN!=='C')qa('.exbody').forEach(fitScroll)}catch(e){}}
function fitSoon(){if(!fitQ)fitQ=requestAnimationFrame(()=>requestAnimationFrame(fitAll))}
try{new MutationObserver(fitSoon).observe(document.getElementById('app')||document.body,{childList:true,subtree:true})}catch(e){}
window.addEventListener('resize',fitSoon);
window.addEventListener('orientationchange',()=>setTimeout(fitSoon,300));
window.__fitAll=fitAll;

/* ---------- 2. 暫停、速度按鈕都加上文字 ---------- */
if(GEN==='C'&&typeof spSync==='function'){
  const _sp=spSync;
  spSync=function(){
    _sp();
    const k=spdIdx(),lab=SPD[k][1];
    qa('.psbtn[data-short]').forEach(b=>{b.innerHTML=SP.paused?'▶ 繼續':'✋ 暫停'});
    qa('.spdbtn[data-short]').forEach(b=>{b.innerHTML=`<span class="sl">說話速度</span><span class="sv">${lab}</span>`;b.title='按一下，換說話速度'});
    qa('.spdbtn:not([data-short])').forEach(b=>{b.innerHTML=`說話速度：${lab}`});
  };
  setTimeout(()=>{try{spSync()}catch(e){}},50);
}

/* ---------- 3. 四年級版本：補上「可以暫停的語音」和速度按鈕 ---------- */
if(GEN==='A'){
  window.SP2={paused:false,cur:null};
  const SPD2=[[0.62,'🐢 慢'],[0.8,'🚶 普通'],[1.0,'🐇 快']];
  const idx=()=>{let k=0,d=9;SPD2.forEach((x,i)=>{const dd=Math.abs(x[0]-S.rate);if(dd<d){d=dd;k=i}});return k};
  speakSeq=function(items,onAll,gap){
    TTS.stop();const gen=TTS.gen;gap=gap==null?260:gap;SP2.paused=false;
    const st={items,i:0,onAll,gap,gen,called:-1,waiting:false,ep:0};SP2.cur=st;sync();
    const next=()=>{
      if(gen!==TTS.gen)return;
      if(SP2.paused){st.waiting=true;return}
      if(st.i>=items.length){if(SP2.cur===st){SP2.cur=null;sync()}onAll&&onAll();return}
      const it=items[st.i],t=typeof it==='string'?it:it.t,on=typeof it==='string'?null:it.on;
      if(st.called<st.i){st.called=st.i;on&&on()}
      const txt=spoken(t),ep=st.ep;
      const done=()=>{if(gen!==TTS.gen||ep!==st.ep)return;if(SP2.paused){st.waiting=true;return}st.i++;later(()=>{if(gen===TTS.gen&&ep===st.ep)next()},gap)};
      if(!S.voice||!TTS.ok||!txt.trim()){later(done,S.voice?TTS.est(txt)*0.5:350);return}
      TTS.one(txt,gen,done);
    };
    st.next=next;if(CLK.paused)return;next();
  };
  say=function(t,cb){speakSeq([t],cb)};
  function pause(){const c=SP2.cur;if(!c)return;SP2.paused=true;c.ep++;c.waiting=true;try{TTS.ok&&speechSynthesis.cancel()}catch(e){}sync()}
  function resume(){SP2.paused=false;sync();const c=SP2.cur;if(c&&c.waiting&&c.gen===TTS.gen){c.waiting=false;c.next()}}
  function setSpd(k){S.rate=SPD2[k][0];sync();try{SFX.tap()}catch(e){}
    const c=SP2.cur;
    if(c&&!SP2.paused&&c.gen===TTS.gen){c.ep++;try{TTS.ok&&speechSynthesis.cancel()}catch(e){}setTimeout(()=>{if(SP2.cur===c&&!SP2.paused)c.next()},150)}
    else if(!c)speakSeq([['這樣唸，比較慢。','這樣唸，是普通的速度。','這樣唸，比較快。'][k]]);
    qa('#spSeg .btn').forEach(b=>b.classList.toggle('sel',Math.abs(+b.dataset.v-S.rate)<.01));
  }
  function sync(){
    qa('.psbtn').forEach(b=>{b.textContent=SP2.paused?'▶ 繼續':'✋ 暫停';b.classList.toggle('y',SP2.paused)});
    const k=idx();
    qa('.spd2').forEach(b=>b.classList.toggle('sel',+b.dataset.i===k));
    qa('.spdbtn').forEach(b=>{b.innerHTML=`<span class="sl">說話速度</span><span class="sv">${SPD2[k][1]}</span>`});
  }
  window.spSync2=sync;
  const BAR2='<div class="spbar2"><button class="btn psbtn">✋ 暫停</button><span class="spl">說話速度</span>'+SPD2.map((x,i)=>`<button class="btn spd2" data-i="${i}">${x[1]}</button>`).join('')+'</div>';
  document.addEventListener('click',e=>{const b=e.target.closest('.psbtn,.spd2,.spdbtn');if(!b)return;e.stopPropagation();if(!guard(250))return;
    if(b.classList.contains('psbtn')){if(SP2.paused)resume();else if(SP2.cur)pause();else{try{SFX.tap()}catch(er){}}}
    else if(b.classList.contains('spd2'))setSpd(+b.dataset.i);else setSpd((idx()+1)%SPD2.length)},true);
  function inject(){
    qa('.les-btns').forEach(x=>{if(!x.querySelector('.spbar2')){x.insertAdjacentHTML('afterbegin',BAR2)}});
    const bar=document.querySelector('#class .bar .sp');if(bar&&!document.querySelector('#class .bar .psbtn'))bar.insertAdjacentHTML('afterend','<button class="btn psbtn" data-short="1">✋ 暫停</button><button class="btn spdbtn" data-short="1"></button>');
    sync();
  }
  let iq=0;try{new MutationObserver(()=>{if(!iq)iq=requestAnimationFrame(()=>{iq=0;inject()})}).observe(document.getElementById('app')||document.body,{childList:true,subtree:true})}catch(e){}
  setTimeout(inject,0);
}

/* ---------- 4. 五年級（1～4單元）：解說、上課加上「說話速度」按鈕 ---------- */
if(GEN==='B'){
  const SPDB=[[0.7,'🐢 慢'],[0.85,'🚶 中'],[1,'🐇 快']];
  const idx=()=>{let k=0,d=9;SPDB.forEach((x,i)=>{const dd=Math.abs(x[0]-S.rate);if(dd<d){d=dd;k=i}});return k};
  const lab=()=>`<span class="sl">說話速度</span><span class="sv">${SPDB[idx()][1]}</span>`;
  function sync(){qa('.exspd').forEach(b=>b.innerHTML=lab())}
  function inject(){
    const ep=document.getElementById('exPause');if(ep&&!document.getElementById('exSpd')){ep.insertAdjacentHTML('afterend','<button class="btn exspd" id="exSpd"></button>');ep.textContent=ep.textContent.replace(/^[✋▶]\s*/,'')}
    const lp=document.getElementById('lsPause');if(lp&&!document.getElementById('lsSpd'))lp.insertAdjacentHTML('afterend','<button class="btn exspd" id="lsSpd"></button>');
    sync();
  }
  document.addEventListener('click',e=>{const b=e.target.closest('.exspd');if(!b)return;e.stopPropagation();if(!guard(250))return;
    S.rate=SPDB[(idx()+1)%SPDB.length][0];try{sset(KEYP+'-rate',S.rate)}catch(er){}try{SFX.tap()}catch(er){}sync();
    if(!TTS.ok||!S.voice)return;},true);
  let iq=0;try{new MutationObserver(()=>{if(!iq)iq=requestAnimationFrame(()=>{iq=0;inject()})}).observe(document.getElementById('app')||document.body,{childList:true,subtree:true})}catch(e){}
  setTimeout(inject,0);
}

/* ---------- 5. 分數顯示：[算式/算式] 也可以排成上下的分數 ---------- */
if(GEN==='C'&&typeof txtHtml==='function'&&typeof fracHTML==='function'){
  const _t=txtHtml;
  txtHtml=function(s){s=String(s==null?'':s);if(s.indexOf('[')<0)return _t(s);
    return s.split(/(\[[^\[\]\/]+\/[^\[\]]+\])/).map(p=>{const m=p.match(/^\[([^\[\]\/]+)\/([^\[\]]+)\]$/);return m?fracHTML(_t(m[1]),_t(m[2])):_t(p)}).join('')};
  if(typeof spoken==='function'){const _s=spoken;spoken=function(s){return _s(String(s).replace(/\[([^\[\]\/]+)\/([^\[\]]+)\]/g,'$2分之$1'))}}
}
})();
